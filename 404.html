<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · TripVibz</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="/assets/analytics.js"></script>
<style>
  .nf{max-width:560px;padding:48px 0 64px}
  .nf h1{font-size:clamp(28px,5vw,40px);font-weight:900;margin:0 0 10px}
  .nf p{font-size:16px;line-height:1.55;color:#3f3a31;margin:0 0 18px}
  .nf .acts{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/"><img class="brand-mark" src="/assets/brand/mark.svg" width="30" height="30" alt="">TripVibz</a>
  </div>
</header>
<main class="wrap">
  <section class="nf">
    <h1>That page doesn't exist.</h1>
    <p id="nf-msg">The link may be old, or the take may have been removed.</p>
    <div class="acts">
      <a class="btn coral" href="/cities/">See all cities</a>
      <a class="btn" href="/">Home</a>
    </div>
  </section>
</main>
<script>
// "/boston/" for a city we don't cover yet: say so, and point to the request box.
(function(){
  var m = location.pathname.match(/^\/([a-z][a-z-]{2,40})\/?$/);
  if (!m) return;
  var name = m[1].split("-").map(function(w){ return w.charAt(0).toUpperCase() + w.slice(1); }).join(" ");
  document.getElementById("nf-msg").textContent = "We don't cover " + name + " yet. You can ask for it on the cities page.";
})();
</script>
</body>
</html>
