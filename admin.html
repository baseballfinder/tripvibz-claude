<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripVibz · Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://nkxorlktzbgwqnfwmuus.supabase.co" crossorigin>
<!--fonts-->
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root{--maxw:1080px}
  main{padding:20px 0 70px}

  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .bar h1{font-size:24px;font-weight:900}
  .bar .count{font-size:13px;color:var(--muted);font-weight:600}

  .filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
  .filters button{font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:6px 13px;cursor:pointer;font-family:"Public Sans"}
  .filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .tools input,.tools select{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;font-size:14px;background:#fff}
  .tools input[type=search]{min-width:230px}

  .row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .row.is-hidden{background:#faf7f4;border-style:dashed;opacity:.85}
  .row.is-rejected{background:#fff6f4;border-color:#f0cfc4}
  .row .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
  .row .t{font-size:15.5px;font-weight:500;color:#2e2b25;line-height:1.5}
  .row .b{font-size:14px;color:#57534a;margin-top:6px;white-space:pre-wrap;line-height:1.5}
  .row .meta{font-size:12px;color:var(--muted);margin-top:9px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .row .meta a{color:var(--ocean);font-weight:600;text-decoration:none}
  .evq{margin:0 0 22px;padding:14px 16px;border:1px solid #f0cfc4;background:#fff8f5;border-radius:12px}
  .evq h2{font-size:17px;margin:0 0 6px}
  .row.ev .actions{display:flex;gap:8px;margin-top:10px}
  .st{font-family:"Archivo";font-weight:700;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
  .st-approved{background:#dff3ec;color:#0c6b5e}
  .st-hidden{background:var(--sand);color:#5b5448}
  .st-rejected{background:#ffe7e0;color:#c0341a}

  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
  .acts button{font-family:"Archivo";font-weight:700;font-size:12.5px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;cursor:pointer;color:var(--ink)}
  .acts button:hover{border-color:#bdb4a3}
  .acts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .acts button.danger{color:#c0341a;border-color:#f0cfc4}
  .acts button.danger:hover{background:#ffe7e0}
  .acts button.go{background:var(--ocean);color:#fff;border-color:var(--ocean)}

  .editor{margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
  .editor label{display:block;font-family:"Archivo";font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
  .editor input,.editor textarea,.editor select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font:inherit;font-size:14.5px;background:var(--paper);margin-bottom:10px}
  .editor textarea{min-height:90px;resize:vertical}
  .editor .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:600px){.editor .two{grid-template-columns:1fr}}

  .gate{max-width:420px;margin:60px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:34px 26px}
  .gate h2{font-size:21px;font-weight:900;margin-bottom:8px}
  .gate p{color:var(--muted);font-size:14.5px;margin:0 0 18px;line-height:1.5}

  .rlm{margin:0 0 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
  .rlm summary{cursor:pointer;padding:12px 14px;font-weight:800;font-family:"Archivo"}
  .rlm summary span{font-weight:500;font-family:"Public Sans";color:var(--muted);font-size:13px;margin-left:6px}
  .rlm-body{padding:0 14px 14px}
  .rlm-body p{font-size:13.5px;color:var(--muted);margin:0 0 10px}
  .rlm-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .rlm-row select,.rlm textarea,.rlm-out input{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:14px "Public Sans",sans-serif;background:#fff}
  .rlm textarea{width:100%;box-sizing:border-box;min-height:80px;margin-bottom:8px}
  .rlm-out{display:flex;gap:8px}
  .rlm-out input{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}
  .rlm-note{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/"><img class="brand-mark" src="/assets/brand/mark.svg" width="30" height="30" alt="">TripVibz</a>
    <nav class="nav-links"><a href="/admin.html" class="active">Admin</a></nav>
    <div class="nav-right"><div id="auth-slot"></div></div>
  </div>
</header>

<main>
  <div class="wrap"><div id="root">
    <div class="state"><b>Checking access…</b>One second.</div>
  </div></div>
</main>

<div class="toast" id="toast"></div>

<script src="/assets/supabase.js"></script>
<script src="/assets/tv.js"></script>
<script>
(function(){
  "use strict";
  const { sb, $, TYPE_LABEL, escapeHtml, timeAgo, toast, auth, openLogin, isSignedIn, routes } = window.TV;

  let ROWS = [], EVENTS = [], CITIES = {}, PROFILES = {}, CHECKS = {}, RESTS = [], RPICKS = [], RSHOW = false;
  let FILTER = "all", CITY = "", SEARCH = "", editing = null;

  const STATUSES = ["approved","hidden","rejected"];

  function fail(html){ $("#root").innerHTML = html; }

  /* ---------- access ---------- */

  async function amAdmin(){
    if(!isSignedIn()) return false;
    try{
      const { data } = await sb.from("profiles").select("is_admin").eq("id", auth.me.id).maybeSingle();
      return !!(data && data.is_admin);
    }catch(e){ console.error(e); return false; }
  }

  function gate(signedIn){
    fail(`<div class="gate">
      <h2>${signedIn ? "Not an admin" : "Admin sign-in"}</h2>
      <p>${signedIn
        ? "This account doesn't have moderator access. Sign in with an admin account."
        : "Sign in with your admin account to review submissions."}</p>
      <button class="btn coral" id="gate-btn">${signedIn ? "Switch account" : "Log in"}</button>
    </div>`);
    $("#gate-btn").addEventListener("click", openLogin);
  }

  /* ---------- data ---------- */

  async function load(){
    const [{ data: rows }, { data: cities }] = await Promise.all([
      sb.from("posts")
        .select("id,title,body,type,status,ups,downs,created_at,author_id,city_id,city_match,submitted_city,moderated_at,moderation_note")
        .order("created_at", { ascending: false }),
      sb.from("cities").select("id,name,slug,state")
    ]);
    ROWS = rows || [];
    (cities||[]).forEach(c => { CITIES[c.id] = c; });
    // Visitors' calendar entries wait here (city_events_guard sets them pending).
    const { data: evs } = await sb.from("city_events")
      .select("id,name,blurb,kind,severity,start_month,end_month,source,status,created_at,author_id,city_id")
      .eq("status", "pending").order("created_at", { ascending: false });
    EVENTS = evs || [];

    const ids = [...new Set(ROWS.map(r => r.author_id).filter(Boolean))];
    if(ids.length){
      const [{ data: profs }, { data: checks }] = await Promise.all([
        sb.from("profiles").select("id,display_name,username").in("id", ids),
        // Presence history is admin-only (admin_local_checks); the public sees verified/revoked alone.
        sb.rpc("admin_local_checks", { p_users: ids })
      ]);
      (profs||[]).forEach(p => { PROFILES[p.id] = p; });
      (checks||[]).forEach(c => { CHECKS[c.user_id + ":" + c.city_id] = c; });
    }
    // Locals' top 3: every restaurant row with how many lists it is on (tables land with migration 20261030140000).
    const [{ data: rests }, { data: rpicks }] = await Promise.all([
      sb.from("restaurants").select("id,city_id,name,neighborhood,hidden,merged_into,created_by,created_at").order("created_at", { ascending: false }),
      sb.from("top3_picks").select("restaurant_id,user_id,rank,why,updated_at")
    ]);
    RESTS = rests || []; RPICKS = rpicks || [];
    const pickers = [...new Set(RPICKS.map(x => x.user_id).concat(RESTS.map(x => x.created_by)))].filter(id => id && !PROFILES[id]);
    if(pickers.length){ const { data: pp } = await sb.from("profiles").select("id,display_name,username").in("id", pickers); (pp||[]).forEach(p => { PROFILES[p.id] = p; }); }
  }

  const authorName = id => {
    const p = id ? PROFILES[id] : null;
    return p ? (p.display_name || p.username || "Guest") : "Unknown";
  };

  function visible(){
    return ROWS.filter(r => {
      if(FILTER !== "all" && r.status !== FILTER) return false;
      if(CITY && r.city_id !== CITY) return false;
      if(SEARCH){
        const hay = ((r.title||"") + " " + (r.body||"")).toLowerCase();
        if(!hay.includes(SEARCH.toLowerCase())) return false;
      }
      return true;
    });
  }

  /* ---------- render ---------- */

  // Reply link maker: pre-fills /<city>/add/ so a person who answered by email
  // posts their own words in one tap (add.html reads ?kind= and ?text=).
  const RLM = { open: false, city: "", kind: "hidden_gem", text: "" };
  function replyLink(){
    const slug = RLM.city || (Object.values(CITIES).sort((a,b)=>a.name.localeCompare(b.name))[0] || {}).slug || "";
    if(!slug) return "";
    const q = new URLSearchParams({ kind: RLM.kind, utm_source: "email", utm_medium: "reply", utm_campaign: "reply_link" });
    const t = RLM.text.trim(); if(t) q.set("text", t.slice(0, 400));
    return `https://www.tripvibz.com/${slug}/add/?${q.toString()}`;
  }
  function wireRlm(){
    const d = $("#rlm"); if(!d) return;
    d.addEventListener("toggle", ()=>{ RLM.open = d.open; });
    const upd = ()=>{ RLM.city = $("#rlm-city").value; RLM.kind = $("#rlm-kind").value; RLM.text = $("#rlm-text").value; $("#rlm-link").value = replyLink(); };
    ["#rlm-city","#rlm-kind"].forEach(id=>$(id).addEventListener("change", upd));
    $("#rlm-text").addEventListener("input", upd);
    $("#rlm-copy").addEventListener("click", async ()=>{
      upd();
      try { await navigator.clipboard.writeText($("#rlm-link").value); toast("Link copied"); }
      catch(e){ $("#rlm-link").select(); toast("Select the link and copy it"); }
    });
  }

  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function eventRow(e){
    const city = CITIES[e.city_id] || {};
    const span = e.start_month === e.end_month ? MONTHS[e.start_month-1] : `${MONTHS[e.start_month-1]}–${MONTHS[e.end_month-1]}`;
    return `<article class="row ev" data-ev="${e.id}">
      <div class="top"><span class="st st-${e.severity === "avoid" ? "rejected" : e.severity === "good" ? "approved" : "hidden"}">${escapeHtml(e.severity)}</span><span class="st st-hidden">${escapeHtml(span)}</span>
        <a href="/${escapeHtml(city.slug||"")}/worst-times-to-visit/" target="_blank" rel="noopener"><b>${escapeHtml(city.name||"?")}</b></a>
        <span class="count">${new Date(e.created_at).toLocaleDateString()}</span></div>
      <div class="t">${escapeHtml(e.name)}</div>
      ${e.blurb ? `<div class="b">${escapeHtml(e.blurb)}</div>` : ""}
      ${e.source ? `<div class="meta"><a href="${escapeHtml(e.source)}" target="_blank" rel="noopener">source</a></div>` : ""}
      <div class="actions"><button data-evact="approved" class="go">Approve</button><button data-evact="rejected">Reject</button></div>
    </article>`;
  }
  // ---- Locals' top 3 restaurants: hide (off the page, picks kept), rename, merge duplicates ----
  function restRow(r){
    const city = CITIES[r.city_id] || {};
    const picks = RPICKS.filter(x => x.restaurant_id === r.id);
    const into = r.merged_into ? RESTS.find(x => x.id === r.merged_into) : null;
    const whys = picks.filter(x => x.why).slice(0, 3).map(x => `“${escapeHtml(x.why)}” — ${escapeHtml(authorName(x.user_id))}`).join("<br>");
    return `<article class="row ev" data-rest="${r.id}">
      <div class="top">${r.hidden ? '<span class="st st-rejected">hidden</span>' : into ? `<span class="st st-hidden">merged → ${escapeHtml(into.name)}</span>` : '<span class="st st-approved">live</span>'}
        <a href="/${escapeHtml(city.slug||"")}/" target="_blank" rel="noopener"><b>${escapeHtml(city.name||"?")}</b></a>
        <span class="count">${picks.length} pick${picks.length === 1 ? "" : "s"} · added ${new Date(r.created_at).toLocaleDateString()} by ${escapeHtml(authorName(r.created_by))}</span></div>
      <div class="t">${escapeHtml(r.name)}${r.neighborhood ? ` <span class="count">${escapeHtml(r.neighborhood)}</span>` : ""}</div>
      ${whys ? `<div class="b">${whys}</div>` : ""}
      <div class="actions">
        <button data-ract="${r.hidden ? "show" : "hide"}">${r.hidden ? "Show again" : "Hide"}</button>
        <button data-ract="rename">Rename</button>
        ${into ? `<button data-ract="unmerge">Unmerge</button>` : `<button data-ract="merge">Merge into…</button>`}
      </div>
    </article>`;
  }
  async function onRestAction(e){
    const btn = e.target.closest("button[data-ract]"); if(!btn) return;
    const id = btn.closest(".row").dataset.rest, r = RESTS.find(x => x.id === id); if(!r) return;
    let patch = null;
    if(btn.dataset.ract === "hide") patch = { hidden: true };
    if(btn.dataset.ract === "show") patch = { hidden: false };
    if(btn.dataset.ract === "unmerge") patch = { merged_into: null };
    if(btn.dataset.ract === "rename"){ const n = prompt("New name for this restaurant", r.name); if(!n || n.trim() === r.name) return; patch = { name: n.trim() }; }
    if(btn.dataset.ract === "merge"){
      const n = prompt("Merge into which restaurant? Type its name exactly (same city).", ""); if(!n) return;
      const key = x => x.toLowerCase().replace(/^\s*the\s+/, "").replace(/[^a-z0-9]+/g, " ").trim();
      const target = RESTS.find(x => x.city_id === r.city_id && x.id !== r.id && !x.merged_into && key(x.name) === key(n));
      if(!target){ toast("No live restaurant by that name in this city"); return; }
      patch = { merged_into: target.id };
    }
    if(!patch) return;
    const { error } = await sb.from("restaurants").update(patch).eq("id", id);
    if(error){ toast("Couldn't update: " + (error.message||"")); return; }
    Object.assign(r, patch); toast("Updated; the city page follows at its next load/build"); render();
  }

  async function onEventAction(e){
    const btn = e.target.closest("button[data-evact]"); if(!btn) return;
    const id = btn.closest(".row").dataset.ev;
    const { error } = await sb.from("city_events").update({ status: btn.dataset.evact }).eq("id", id);
    if(error){ toast("Couldn't update: " + (error.message||"")); return; }
    EVENTS = EVENTS.filter(x => x.id !== id);
    toast(btn.dataset.evact === "approved" ? "On the calendar at the next build" : "Rejected");
    render();
  }

  function render(){
    const list = visible();
    const counts = STATUSES.reduce((a,s)=>(a[s]=ROWS.filter(r=>r.status===s).length,a),{});

    $("#root").innerHTML = `
      <div class="bar">
        <h1>Submissions</h1>
        <span class="count">${ROWS.length} total · ${counts.approved} live · ${counts.hidden} hidden · ${counts.rejected} rejected</span>
      </div>

      <details class="rlm" id="rlm" ${RLM.open ? "open" : ""}>
        <summary>Reply link maker <span>turn an email reply into a one-tap "post it" link</span></summary>
        <div class="rlm-body">
          <p>Paste what they wrote, pick their city and the kind of take. Send them the link: it opens their city's page with their words already filled in, so they post it themselves.</p>
          <div class="rlm-row">
            <select id="rlm-city">${Object.values(CITIES).sort((a,b)=>a.name.localeCompare(b.name))
              .map(c=>`<option value="${c.slug}" ${RLM.city===c.slug?"selected":""}>${escapeHtml(c.name)}</option>`).join("")}</select>
            <select id="rlm-kind">${[["hidden_gem","Do this (their spot)"],["what_not_to_do","Don't do this"],["worst_times","When to go"],["take","It depends"]]
              .map(([k,l])=>`<option value="${k}" ${RLM.kind===k?"selected":""}>${l}</option>`).join("")}</select>
          </div>
          <textarea id="rlm-text" maxlength="400" placeholder="e.g. I take everyone to Joe's Stone Crab's takeaway counter: same claws, no wait.">${escapeHtml(RLM.text)}</textarea>
          <div class="rlm-out">
            <input id="rlm-link" readonly value="${escapeHtml(replyLink())}">
            <button id="rlm-copy" class="go">Copy link</button>
          </div>
          <div class="rlm-note">Trim it to one or two sentences: a take holds 400 characters. Nothing is posted until they tap Post.</div>
        </div>
      </details>

      ${EVENTS.length ? `<section class="evq" id="evq">
        <h2>Calendar suggestions <span class="count">${EVENTS.length} waiting</span></h2>
        <p class="rlm-note">Entries visitors added to a city's "Worst times to visit" calendar. Approved ones appear after the next site build.</p>
        <div id="evrows">${EVENTS.map(eventRow).join("")}</div>
      </section>` : ""}

      ${RESTS.length ? `<section class="evq" id="rq">
        <h2>Locals' top 3 restaurants <span class="count">${RESTS.length} places · ${RPICKS.length} picks</span> <button data-rtoggle style="margin-left:8px">${RSHOW ? "Hide list" : "Show list"}</button></h2>
        <p class="rlm-note">Names typed by locals. Hide takes a place off the page (its picks stay), Rename fixes spelling, Merge points duplicates at one row.</p>
        ${RSHOW ? `<div id="rrows">${RESTS.map(restRow).join("")}</div>` : ""}
      </section>` : ""}

      <div class="filters" id="filters">
        <button data-f="all" aria-pressed="${FILTER==="all"}">All</button>
        ${STATUSES.map(s=>`<button data-f="${s}" aria-pressed="${FILTER===s}">${s} (${counts[s]})</button>`).join("")}
      </div>

      <div class="tools">
        <input type="search" id="q" placeholder="Search title or body…" value="${escapeHtml(SEARCH)}">
        <select id="city">
          <option value="">All cities</option>
          ${Object.values(CITIES).sort((a,b)=>a.name.localeCompare(b.name))
            .map(c=>`<option value="${c.id}" ${CITY===c.id?"selected":""}>${escapeHtml(c.name)}</option>`).join("")}
        </select>
        <span class="count">${list.length} shown</span>
      </div>

      <div id="rows">${list.length ? list.map(row).join("") : `<div class="state"><b>Nothing matches</b>Try another filter.</div>`}</div>`;

    $("#filters").addEventListener("click", e=>{
      const b=e.target.closest("button[data-f]"); if(!b) return;
      FILTER=b.dataset.f; editing=null; render();
    });
    const q=$("#q");
    q.addEventListener("input", ()=>{ SEARCH=q.value; const p=q.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(p,p); });
    $("#city").addEventListener("change", e=>{ CITY=e.target.value; editing=null; render(); });
    $("#rows").addEventListener("click", onAction);
    const evq = $("#evrows"); if(evq) evq.addEventListener("click", onEventAction);
    const rq = $("#rrows"); if(rq) rq.addEventListener("click", onRestAction);
    const rt = document.querySelector("[data-rtoggle]"); if(rt) rt.addEventListener("click", () => { RSHOW = !RSHOW; render(); });
    wireRlm();
  }

  // Presence for this author in this city (functions/api/locate.js → record_presence):
  // days seen near the city and the span they cover, which is what earns the ✓.
  function localTag(r){
    const c = r.author_id && r.city_id ? CHECKS[r.author_id + ":" + r.city_id] : null;
    if(!c) return '<span class="loc">No location check</span>';
    if(c.revoked) return '<span class="loc" style="color:#c0341a">Local revoked</span>';
    const d = n => n ? new Date(n).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
    const span = c.first_near && c.last_near ? Math.round((new Date(c.last_near) - new Date(c.first_near)) / 864e5) : 0;
    const hist = `${c.near_days || 0} day${c.near_days === 1 ? "" : "s"} near${c.near_days ? ` (${d(c.first_near)}–${d(c.last_near)}, ${span}d span)` : ""}`;
    if(c.verified) return `<span class="loc loc-local">✓ Verified local · ${hist}</span>`;
    const last = c.band === "hosting" ? "last check from a hosting/VPN network" : c.near ? "near at last check" : `${c.band || "not near"} at last check`;
    return `<span class="loc">Unverified · ${hist} · ${last}</span>`;
  }

  async function setLocal(r, revoked){
    const key = r.author_id + ":" + r.city_id, prev = CHECKS[key], at = revoked ? new Date().toISOString() : null;
    const { error } = prev
      ? await sb.from("local_checks").update({ revoked, revoked_at: at }).eq("user_id", r.author_id).eq("city_id", r.city_id)
      : await sb.from("local_checks").insert({ user_id: r.author_id, city_id: r.city_id, near: false, revoked, revoked_at: at });
    if(error){ console.error(error); toast("Couldn't change local status"); return; }
    CHECKS[key] = Object.assign({ user_id: r.author_id, city_id: r.city_id, near: false }, prev || {}, { revoked });
    toast(revoked ? "Local status revoked for this city" : "Local status restored");
    render();
  }

  function row(r){
    const city = CITIES[r.city_id];
    const isEditing = editing === r.id;
    return `<article class="row ${r.status==='hidden'?'is-hidden':''} ${r.status==='rejected'?'is-rejected':''}" data-id="${r.id}">
      <div class="top">
        <span class="st st-${r.status}">${r.status}</span>
        <span class="badge b-${r.type}">${TYPE_LABEL[r.type]||r.type}</span>
        ${r.city_match === true ? '<span class="loc loc-local">Local</span>' : ""}
        ${localTag(r)}
      </div>

      <div class="t">${escapeHtml(r.title)}</div>
      ${r.body ? `<div class="b">${escapeHtml(r.body)}</div>` : ""}

      <div class="meta">
        <span>${escapeHtml(authorName(r.author_id))}</span>
        <span>${timeAgo(r.created_at)} ago</span>
        <span>▲ ${r.ups} ▼ ${r.downs}</span>
        ${city ? `<span>${escapeHtml(city.name)}</span>` : '<span style="color:#c0341a">no city</span>'}
        ${r.submitted_city ? `<span>from ${escapeHtml(r.submitted_city)}</span>` : ""}
        ${city ? `<a href="${routes.article(city.slug, r.type)}" target="_blank" rel="noopener">view →</a>` : ""}
      </div>

      <div class="acts">
        ${r.status !== "approved" ? `<button data-act="approved" class="go">Approve</button>` : ""}
        ${r.status !== "hidden"   ? `<button data-act="hidden">Hide</button>` : ""}
        ${r.status !== "rejected" ? `<button data-act="rejected">Reject</button>` : ""}
        ${r.author_id && r.city_id ? ((CHECKS[r.author_id + ":" + r.city_id] || {}).revoked
          ? `<button data-act="restore-local">Restore local</button>`
          : `<button data-act="revoke-local">Revoke local</button>`) : ""}
        <button data-act="edit" class="${isEditing?"on":""}">${isEditing?"Cancel":"Edit"}</button>
        <button data-act="delete" class="danger">Delete</button>
      </div>

      ${isEditing ? editor(r) : ""}
    </article>`;
  }

  function editor(r){
    return `<div class="editor">
      <label>Headline</label>
      <input type="text" data-f="title" maxlength="140" value="${escapeHtml(r.title)}">
      <label>Body</label>
      <textarea data-f="body" maxlength="2000">${escapeHtml(r.body||"")}</textarea>
      <div class="two">
        <div>
          <label>Type</label>
          <select data-f="type">
            ${Object.keys(TYPE_LABEL).map(t=>`<option value="${t}" ${r.type===t?"selected":""}>${TYPE_LABEL[t]}</option>`).join("")}
          </select>
        </div>
        <div>
          <label>City</label>
          <select data-f="city_id">
            <option value="">— none —</option>
            ${Object.values(CITIES).sort((a,b)=>a.name.localeCompare(b.name))
              .map(c=>`<option value="${c.id}" ${r.city_id===c.id?"selected":""}>${escapeHtml(c.name)}</option>`).join("")}
          </select>
        </div>
      </div>
      <label>Internal note (not public)</label>
      <input type="text" data-f="moderation_note" maxlength="300" value="${escapeHtml(r.moderation_note||"")}">
      <button class="btn coral" data-act="save">Save changes</button>
    </div>`;
  }

  /* ---------- actions ---------- */

  async function onAction(e){
    const btn = e.target.closest("button[data-act]"); if(!btn) return;
    const art = btn.closest(".row"); const id = art.dataset.id;
    const r = ROWS.find(x=>x.id===id); if(!r) return;
    const act = btn.dataset.act;

    if(act === "edit"){ editing = editing === id ? null : id; render(); return; }
    if(act === "revoke-local" || act === "restore-local"){ await setLocal(r, act === "revoke-local"); return; }

    if(act === "save"){
      const get = f => art.querySelector(`[data-f="${f}"]`).value;
      const patch = {
        title: get("title").trim(),
        body: get("body").trim() || null,
        type: get("type"),
        city_id: get("city_id") || null,
        moderation_note: get("moderation_note").trim() || null
      };
      if(patch.title.length < 5){ toast("Headline is too short"); return; }
      btn.disabled = true; btn.textContent = "Saving…";
      try{
        const { error } = await sb.from("posts").update(patch).eq("id", id);
        if(error) throw error;
        Object.assign(r, patch);
        editing = null; render(); toast("Saved");
      }catch(err){
        console.error(err); btn.disabled = false; btn.textContent = "Save changes";
        toast(window.TV.moderationMessage(err) || "Couldn't save");
      }
      return;
    }

    if(act === "delete"){
      // Deletion is permanent and cascades to comments and votes.
      if(!confirm(`Permanently delete this submission?\n\n"${r.title}"\n\nThis cannot be undone. Use Hide if you only want it off the site.`)) return;
      try{
        const { error } = await sb.from("posts").delete().eq("id", id);
        if(error) throw error;
        ROWS = ROWS.filter(x=>x.id!==id); render(); toast("Deleted");
      }catch(err){ console.error(err); toast("Couldn't delete"); }
      return;
    }

    if(STATUSES.includes(act)){
      try{
        const { error } = await sb.from("posts").update({ status: act }).eq("id", id);
        if(error) throw error;
        r.status = act; render();
        toast(act === "approved" ? "Live again" : act === "hidden" ? "Hidden from the site" : "Rejected");
      }catch(err){ console.error(err); toast("Couldn't update status"); }
    }
  }

  /* ---------- init ---------- */

  auth.onSignOut = async function(){ location.reload(); };

  (async function init(){
    await auth.ensure();
    if(!isSignedIn()){ gate(false); return; }
    if(!(await amAdmin())){ gate(true); return; }
    try{
      await load();
      render();
    }catch(e){
      console.error(e);
      fail(`<div class="state"><b>Couldn't load submissions</b>${escapeHtml(e.message||"")}</div>`);
    }
  })();
})();
</script>
</body>
</html>
