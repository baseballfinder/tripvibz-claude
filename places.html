<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripVibz · Places</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/analytics.js"></script>
<style>
  /* places-only layout */
  .head{padding:26px 0 4px}
  .head h1{font-size:clamp(28px,4.5vw,42px);font-weight:900}
  .head p{color:var(--muted);font-size:15.5px;margin:8px 0 0;max-width:60ch}
  .search{margin:18px 0 6px}
  .search input{width:100%;max-width:420px;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font:inherit;font-size:14.5px;background:#fff}
  .search input:focus{outline:2px solid var(--coral);outline-offset:1px}

  .section-label{font-family:"Archivo";font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 2px 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px;margin-bottom:10px}
  .city-card{display:block;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-decoration:none;transition:transform .1s ease,box-shadow .12s ease}
  a.city-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(22,20,15,.1)}
  .city-card.is-thin .city-foot{color:var(--coral)}
  .city-top{height:104px;position:relative;overflow:hidden;display:flex;align-items:flex-start;justify-content:flex-end;padding:10px}
  .city-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  /* renamed from .state so it doesn't collide with the shared empty-state block */
  .city-state{position:relative;z-index:1;background:rgba(255,255,255,.92);color:var(--ink);font-family:"Archivo";font-weight:800;font-size:11px;letter-spacing:.05em;padding:3px 8px;border-radius:999px}
  .city-top .pin{position:absolute;left:12px;bottom:10px;z-index:1;font-size:20px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
  .city-body{padding:13px 15px 16px}
  .city-body h3{font-size:18px;font-weight:800}
  .city-body p{font-size:13px;color:var(--muted);margin:5px 0 11px;line-height:1.45;min-height:36px}
  .city-foot{font-family:"Archivo";font-weight:700;font-size:12.5px;color:var(--ocean)}
  .city-foot.soon{color:var(--muted);font-weight:600}
  .city-foot .dotsep{color:var(--line);margin:0 6px}
  .empty{grid-column:1/-1;padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:#fff}
  footer{margin-top:30px;padding:24px 0}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/"><span class="dot"></span>TripVibz</a>
    <nav class="nav-links">
      <a href="/">Feed</a>
      <a href="/cities/" class="active">Places</a>
    </nav>
    <div class="nav-right"><a class="btn" href="/">Back to feed</a></div>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <h1>Where to next?</h1>
    <p>Browse by city. Real local takes and the places worth your time — no top-10 filler. Start in South Florida; more cities are filling in.</p>
  </div>
  <div class="search"><input id="search" type="search" placeholder="Search a city or state…" autocomplete="off"></div>

  <div id="live-wrap">
    <div class="section-label" id="live-label" hidden>Live now</div>
    <div class="grid" id="live-grid"></div>
  </div>
  <div id="soon-wrap">
    <div class="section-label" id="soon-label" hidden>Coming soon</div>
    <div class="grid" id="soon-grid"></div>
  </div>
</main>

<footer><div class="wrap"><span class="tagline">Take the city, don't let the city take you.</span> · TripVibz</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/tv.js"></script>
<script>
(function(){
  "use strict";
  const { sb, $, escapeHtml, routes } = window.TV;

  let CITIES=[];

  function hueFor(name){ let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))%360; return h; }
  function band(name){
    const h=hueFor(name);
    return `linear-gradient(135deg, hsl(${h} 55% 52%), hsl(${(h+38)%360} 60% 42%))`;
  }
  function countLine(c){
    if(c.take_count>0) return `${c.take_count} local take${c.take_count===1?'':'s'}`;
    return `Needs locals — be the first`;
  }
  const IMG_BASE = "https://nkxorlktzbgwqnfwmuus.supabase.co/storage/v1/object/public/city-photos";

  function card(c){
    // Every city is reachable. The articles exist for all of them, and an
    // empty one is an invitation to contribute rather than a dead end —
    // gating on place_count made 14 of 18 cities unclickable.
    const live = c.take_count > 0;
    const inner = `
      <div class="city-top" style="background:${band(c.name)}">
        <img class="city-img" src="${IMG_BASE}/${encodeURIComponent(c.photo || c.slug + ".webp")}" alt="${escapeHtml(c.name)}" loading="lazy" onerror="this.remove()">
        <span class="pin">📍</span>
        <span class="city-state">${escapeHtml(c.state||"US")}</span>
      </div>
      <div class="city-body">
        <h3>${escapeHtml(c.name)}</h3>
        <p>${escapeHtml(c.blurb||"")}</p>
        <div class="city-foot ${live?'':'soon'}">${countLine(c)}</div>
      </div>`;
    return `<a class="city-card${live ? "" : " is-thin"}" href="${routes.city(c.slug)}">${inner}</a>`;
  }

  function render(q){
    q=(q||"").trim().toLowerCase();
    const match = c => !q || c.name.toLowerCase().includes(q) || (c.state||"").toLowerCase().includes(q);
    const live = CITIES.filter(c=>c.take_count>0 && match(c));
    const soon = CITIES.filter(c=>!(c.take_count>0) && match(c));
    $("#live-grid").innerHTML = live.map(card).join("");
    $("#soon-grid").innerHTML = soon.map(card).join("");
    $("#live-label").hidden = !live.length;
    $("#soon-label").hidden = !soon.length;
    $("#soon-label").textContent = "Open for locals";
    if(!live.length && !soon.length){
      $("#live-grid").innerHTML = `<div class="empty">No cities match “${escapeHtml(q)}”.</div>`;
    }
  }

  $("#search").addEventListener("input", e=>render(e.target.value));

  (async function load(){
    try{
      const { data, error } = await sb.from("cities_with_counts").select("*").order("sort");
      if(error) throw error;
      CITIES = data||[];
      render("");
    }catch(e){
      console.error(e);
      $("#live-grid").innerHTML = `<div class="empty">Couldn't load cities from the database.</div>`;
    }
  })();
})();
</script>
</body>
</html>
