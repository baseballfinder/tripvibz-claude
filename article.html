<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripVibz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://nkxorlktzbgwqnfwmuus.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/v2.css">
<script src="/assets/analytics.js"></script>
<style>
  :root{--maxw:720px}
  main{padding:20px 0 70px}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:14px}
  .back:hover{color:var(--ink)}

  .hd .kicker{font-family:"Archivo";font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--coral)}
  .hd h1{font-size:clamp(27px,5.4vw,42px);font-weight:900;line-height:1.08;margin:11px 0 12px}
  .hd .lede{font-size:16.5px;color:#39352d;line-height:1.55;margin:0 0 14px}
  .hd .by{font-size:13px;color:var(--muted);font-weight:600}

  .themes{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 2px}
  .themes a{font-family:"Archivo";font-weight:700;font-size:13px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;text-decoration:none;color:var(--muted)}
  .themes a:hover{border-color:#bdb4a3;color:var(--ink)}
  .themes a.on{background:var(--sand);border-color:var(--ink);color:var(--ink)}

  .areas{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 2px}
  .areas button{font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;font-family:"Public Sans"}
  .areas button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ---- month calendar (worst_times only) ---- */
  .cal{margin-top:34px}
  .themes + .cal{margin-top:22px}
  .ev .w a{color:inherit;text-decoration:underline}
  .cal-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .cal-head h2{font-family:"Archivo";font-weight:900;font-size:21px}
  .cal-head .sub{font-size:13.5px;color:var(--muted);margin:6px 0 0;line-height:1.5;flex-basis:100%}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 12px;font-size:12px;color:var(--muted);font-weight:600}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
  .sw-avoid{background:#f5b5a4}.sw-busy{background:#f0d492}.sw-good{background:#a8ddcd}.sw-none{background:var(--sand)}

  .cal-months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  @media(max-width:620px){.cal-months{grid-template-columns:repeat(3,1fr)}}
  .m{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px 9px;cursor:pointer;text-align:center;font-family:"Public Sans";transition:transform .08s ease}
  .m:hover{transform:translateY(-2px)}
  .m .mn{font-family:"Archivo";font-weight:800;font-size:14px;color:var(--ink);display:block}
  .m .mc{font-size:11px;color:var(--muted);margin-top:3px;display:block;min-height:14px}
  .m.avoid{background:#ffe7e0;border-color:#f5c4b6}
  .m.avoid .mc{color:#a52d15}
  .m.busy{background:#fff1d6;border-color:#f0dca8}
  .m.busy .mc{color:#8a5f00}
  .m.good{background:#dff3ec;border-color:#a8ddcd}
  .m.good .mc{color:#0c6b5e}
  .m[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:1px}

  .m-detail{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .m-detail h3{font-family:"Archivo";font-weight:800;font-size:16px;margin-bottom:10px}
  .ev{padding:11px 0;border-top:1px solid var(--line)}
  .ev:first-of-type{border-top:none}
  .ev .n{font-family:"Archivo";font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ev .n .sev{font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
  .sev.avoid{background:#ffe7e0;color:#c0341a}
  .sev.busy{background:#fff1d6;color:#9a6a00}
  .sev.good{background:#dff3ec;color:#0c6b5e}
  .ev .b{font-size:14px;color:#4a463d;margin-top:5px;line-height:1.5}
  .ev .w{font-size:12px;color:var(--muted);margin-top:5px}
  .m-detail .none{color:var(--muted);font-size:14px}

  .ev-add{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .ev-add h3{font-family:"Archivo";font-weight:800;font-size:15px;margin-bottom:4px}
  .ev-add .sub{font-size:13px;color:var(--muted);margin-bottom:13px}
  .ev-swap{border:none;background:none;color:var(--ocean);font-size:12.5px;font-weight:600;cursor:pointer;font-family:"Public Sans";text-decoration:underline;padding:0;margin-left:6px}
  .ev-swap:hover{color:var(--ink)}
  .ev-add label{display:block;font-family:"Archivo";font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
  .ev-add input[type=text],.ev-add select,.ev-add textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font:inherit;font-size:14.5px;background:var(--paper);margin-bottom:12px}
  .ev-add textarea{min-height:70px;resize:vertical}
  .ev-add input:focus,.ev-add select:focus,.ev-add textarea:focus{outline:2px solid var(--coral);outline-offset:1px;background:#fff}
  .ev-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  @media(max-width:560px){.ev-grid{grid-template-columns:1fr}}
  .ev-gate{text-align:center;padding:6px 0 2px}
  .ev-gate p{font-size:13.5px;color:var(--muted);margin:0 0 12px}

  .reject{background:#ffe7e0;border:1px solid #f5c4b6;color:#a52d15;font-size:13.5px;font-weight:600;border-radius:9px;padding:11px 13px;margin:0 0 12px;line-height:1.45}
  main{padding-bottom:110px}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/"><img class="brand-mark" src="/assets/brand/mark.svg" width="30" height="30" alt="">TripVibz</a>
    <nav class="nav-links"><a href="/cities/">Cities</a></nav>
    <div class="nav-right"><div id="auth-slot"></div></div>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="root"><div class="state"><b>Loading…</b>One second.</div></div>
  </div>
</main>


<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/tv.js"></script>
<script src="/assets/v2.js"></script>
<script>
(function(){
  "use strict";
  const { sb, $, escapeHtml, toast, auth, openLogin, isSignedIn, moderationMessage, routes } = window.TV;
  const T2 = window.TV2;

  const qs = new URLSearchParams(location.search);
  const R = window.TV.parseRoute();
  const SLUG  = R.city;
  const THEME = R.theme || "what_not_to_do";
  const JUMP  = qs.get("add") === "1";
  // Links from Miami Take (email/social) carry src=miamitake.

  // ---------------------------------------------------------------------
  // Themes = the articles. Adding one here creates a new article on every
  // city automatically. Prompts stay about how the city works, never about
  // a named business.
  // ---------------------------------------------------------------------
  const THEMES = {
    what_not_to_do: {
      vent: c => `What do tourists do in ${c} that drives you crazy?`,
      starters: c => [`Never ___ in ${c}, because ___.`, `Skip ___. Locals ___ instead.`, `Visitors always ___. Don't.`],
      nav:   "What not to do",
      title: c => `What not to do in ${c}`,
      lede:  c => `The mistakes visitors make in ${c}, according to people who live there. Ranked by how many locals say it's true.`,
      ask:   c => `What do visitors get wrong in ${c}?`,
      prompts: [
        "Standing in the bike lane to take photos. It's a road, not a viewing platform.",
        "Renting a car. You'll pay $45 a night to park it and never once need it.",
        "Beach chair rentals — walk two blocks north and the same sand is free.",
        "Wearing beachwear inland. Locals cover up the second they leave the sand.",
        "Assuming it's walkable. The two halves are 40 minutes apart in traffic."
      ]
    },
    worst_times: {
      vent: c => `When should tourists just stay away from ${c}?`,
      starters: c => [`Avoid ${c} in ___, because ___.`, `Don't go to ___ on ___. ___.`, `___ is the worst week. Come ___ instead.`],
      nav:   "Worst times to visit",
      title: c => `Worst times to visit ${c}`,
      lede:  c => `The weeks, days and hours locals would tell you to avoid in ${c} — and what to do instead.`,
      ask:   c => `When should visitors avoid ${c}, and why?`,
      prompts: [
        "Mid-March. Every hotel triples its rate and you won't get a table anywhere.",
        "Race weekend — the downtown grid shuts and nothing moves for three days.",
        "Don't hit the waterfront at sunset with everyone else. Go an hour early.",
        "August. It's not the heat, it's that half the good places close for the month."
      ]
    },
    hidden_gem: {
      vent: c => `What do tourists never figure out about ${c}?`,
      starters: c => [`Locals actually go to ___ for ___.`, `Instead of ___, try ___.`, `Nobody visiting knows about ___.`],
      nav:   "What locals actually do",
      title: c => `What locals actually do in ${c}`,
      lede:  c => `The parts of ${c} that don't show up on the top-ten lists, from people who never left.`,
      ask:   c => `What do locals in ${c} do that visitors never find?`,
      prompts: [
        "The stretch of park behind the marina — same water view, none of the crowd.",
        "Tuesday markets. Everyone goes Saturday; Tuesday is the same vendors, no queue.",
        "Dinner starts at 9 here. Show up at 6 and you'll eat alone in an empty room."
      ]
    }
  };

  const CFG = THEMES[THEME];

  let CITY = null, ENTRIES = [], CTX = null;
  let EVENTS = [], SEL_MONTH = new Date().getMonth() + 1, evEgIx = 0;

  // Deliberately generic. Naming one city's festival on another city's page
  // ("Fantasy Fest" on Austin) reads as a mistake and suggests the wrong
  // kind of answer. These work anywhere and interpolate the city name.
  const EVENT_EG = [
    { n: "Marathon weekend",
      w: c => `Downtown ${c} closes to traffic and the hotels book out months ahead.` },
    { n: "Peak season",
      w: c => `Rooms roughly double and you need a reservation for everything.` },
    { n: "Convention week",
      w: c => `A big convention takes most of the hotel rooms in ${c} and rates spike city-wide.` },
    { n: "Festival weekend",
      w: c => `The main strip is impassable and every bar runs a 40-minute wait.` },
    { n: "State fair",
      w: c => `Parking anywhere near the grounds is gone by mid-morning.` },
    { n: "Shoulder season",
      w: c => `Same weather, thinner crowds, noticeably cheaper — the locals' answer.` },
    { n: "Holiday week",
      w: c => `Everything in ${c} is booked and priced for people who planned in advance.` }
  ];

  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONTHS_LONG = ["January","February","March","April","May","June","July",
                       "August","September","October","November","December"];
  const SEV_RANK = { good:1, busy:2, avoid:3 };

  // spans wrap the new year, e.g. hurricane season 6 -> 11, or Dec -> Feb
  const covers = (ev, m) => ev.start_month <= ev.end_month
    ? (m >= ev.start_month && m <= ev.end_month)
    : (m >= ev.start_month || m <= ev.end_month);
  const eventsIn = m => EVENTS.filter(e => covers(e, m));
  function monthSeverity(m){ return T2.monthSeverity(EVENTS, m); }   // shared rule in assets/v2.js
  const spanLabel = ev => ev.start_month === ev.end_month
    ? MONTHS_LONG[ev.start_month-1]
    : `${MONTHS[ev.start_month-1]} – ${MONTHS[ev.end_month-1]}`;

  function fail(msg){
    $("#root").innerHTML = `<div class="state"><b>Can't load that</b>${escapeHtml(msg)}<br><br><a href="/cities/">← Pick a city</a></div>`;
  }
  const addHref = text => `/${encodeURIComponent(SLUG)}/add/?kind=${encodeURIComponent(THEME)}` + (text ? `&text=${encodeURIComponent(text)}` : "");

  // ---------------------------------------------------------------------
  function render(){
    const list = T2.sortPosts(ENTRIES, "top");
    const locals = new Set(ENTRIES.filter(e => e.author_verified && e.author_id).map(e => e.author_id)).size;

    $("#root").innerHTML = `
      <a class="back" href="${routes.city(CITY.slug)}">← ${escapeHtml(CITY.name)}</a>

      <div class="hd">
        <div class="kicker">${escapeHtml(CITY.name)}${CITY.state ? ", "+escapeHtml(CITY.state) : ""}</div>
        <h1>${escapeHtml(CFG.title(CITY.name))}</h1>
        <p class="lede">${escapeHtml(CFG.lede(CITY.name))}</p>
        ${ENTRIES.length ? `<div class="by">${ENTRIES.length} take${ENTRIES.length===1?"":"s"}${locals ? ` · ${locals} signed-in local${locals===1?"":"s"}` : ""}</div>` : ""}
      </div>

      <div class="themes">
        ${Object.keys(THEMES).map(k=>
          `<a class="${k===THEME?"on":""}" href="${routes.article(CITY.slug,k)}">${escapeHtml(THEMES[k].nav)}</a>`
        ).join("")}
      </div>

      ${THEME === "worst_times" && !list.length ? calendarBlock() : ""}

      <div class="feed" id="entries" style="margin-top:20px">
        ${list.length ? list.map(p => T2.takeHtml(p, CTX)).join("") :
          `<div class="empty2"><b>No takes here yet</b>Live in ${escapeHtml(CITY.name)}? One sentence is enough, and the first 10 signed-in locals are its founding locals.</div>`}
      </div>

      ${addCard()}

      ${THEME === "worst_times" && list.length ? calendarBlock() : ""}`;

    $("#entries").addEventListener("click", async e => {
      const b = e.target.closest("[data-vote]"); if (!b) return;
      const p = ENTRIES.find(x => x.id === b.dataset.id); if (!p) return;
      await T2.castVote(p, CTX, Number(b.dataset.vote));
      b.closest(".take").outerHTML = T2.takeHtml(p, CTX);
    });
    if(THEME === "worst_times") wireCalendar();
  }

  // Posting happens on the city's add page (kinds, places, months, optional
  // sign-in). Here: one tap on a starter or the button takes you there.
  function addCard(){
    return `<section class="qcard" style="margin-top:22px">
      <div class="qk">${ENTRIES.length ? "Add yours" : "Locals only"}</div>
      <div class="qp">${escapeHtml(ENTRIES.length ? CFG.ask(CITY.name) : CFG.vent(CITY.name))}</div>
      <div class="qopts">${CFG.starters(CITY.name).map(s =>
        `<a class="qopt" href="${addHref(s)}"><span>${escapeHtml(s)}</span></a>`).join("")}</div>
      <a class="btn coral" href="${addHref("")}" style="display:flex;justify-content:center;margin-top:14px;text-decoration:none">Write your own</a>
    </section>`;
  }

  function calendarBlock(){
    const cells = MONTHS.map((mn, i) => {
      const m = i + 1;
      const sev = monthSeverity(m);
      const n = eventsIn(m).length;
      return `<button class="m ${sev || ""}" data-m="${m}" aria-pressed="${SEL_MONTH===m}">
        <span class="mn">${mn}</span>
        <span class="mc">${n ? (sev === "good" ? "best" : n + (n===1?" flag":" flags")) : ""}</span>
      </button>`;
    }).join("");

    const sel = eventsIn(SEL_MONTH).sort((a,b)=>SEV_RANK[b.severity]-SEV_RANK[a.severity]);

    return `<section class="cal">
      <div class="cal-head">
        <h2>${escapeHtml(CITY.name)} month by month</h2>
        <p class="sub">Festivals, conventions, weather and price seasons that change what a
           visit is like. <b>Researched by the TripVibz editors</b> from official event and
           weather sources, and checked monthly. Dates shift year to year, so confirm the
           exact weekend before you book.</p>
      </div>

      ${EVENTS.length ? `<div class="when-t cal-sum">${T2.whenSummary(EVENTS)}</div>` : ""}

      <div class="legend">
        <span><i class="sw-avoid"></i>Avoid</span>
        <span><i class="sw-busy"></i>Busy or risky</span>
        <span><i class="sw-good"></i>Good window</span>
        <span><i class="sw-none"></i>Nothing flagged</span>
      </div>

      <div class="cal-months" id="months">${cells}</div>

      <div class="m-detail">
        <h3>${MONTHS_LONG[SEL_MONTH-1]} in ${escapeHtml(CITY.name)}</h3>
        ${sel.length ? sel.map(ev => `<div class="ev">
            <div class="n">${escapeHtml(ev.name)}<span class="sev ${ev.severity}">${ev.severity}</span></div>
            ${ev.blurb ? `<div class="b">${escapeHtml(ev.blurb)}</div>` : ""}
            <div class="w">${escapeHtml(spanLabel(ev))} · ${escapeHtml(ev.kind)}${
              ev.source && /^https:\/\//.test(ev.source) ? ` · <a href="${escapeHtml(ev.source)}" target="_blank" rel="noopener nofollow">Source</a>` : ""}</div>
          </div>`).join("")
          : `<div class="none">Nothing flagged for ${MONTHS_LONG[SEL_MONTH-1]} yet. If you know this
             city, add what happens then.</div>`}
      </div>

      ${eventAddBlock()}
    </section>`;
  }

  function eventAddBlock(){
    if(!isSignedIn()){
      return `<div class="ev-add"><div class="ev-gate">
        <p>Know a festival, season or week that changes this city? Add it to the calendar.</p>
        <button class="btn" id="ev-login">Log in to add an event</button>
      </div></div>`;
    }
    const opts = MONTHS_LONG.map((m,i)=>`<option value="${i+1}">${m}</option>`).join("");
    const eg = EVENT_EG[evEgIx % EVENT_EG.length];
    return `<div class="ev-add">
      <h3>Add something to the calendar</h3>
      <div class="sub">A festival, a season, a weekend locals dread — anything that changes what a month is like.
        <button class="ev-swap" id="ev-swap">Show another example</button></div>
      <div id="ev-slot"></div>
      <label for="ev-name">What is it?</label>
      <input type="text" id="ev-name" maxlength="80" placeholder="${escapeHtml(eg.n)}">
      <div class="ev-grid">
        <div>
          <label for="ev-start">From</label>
          <select id="ev-start">${opts}</select>
        </div>
        <div>
          <label for="ev-end">To</label>
          <select id="ev-end">${opts}</select>
        </div>
        <div>
          <label for="ev-sev">Verdict</label>
          <select id="ev-sev">
            <option value="avoid">Avoid</option>
            <option value="busy" selected>Busy or risky</option>
            <option value="good">Good window</option>
          </select>
        </div>
      </div>
      <label for="ev-blurb">Why does it matter?</label>
      <textarea id="ev-blurb" maxlength="400" placeholder="${escapeHtml(eg.w(CITY.name))}"></textarea>
      <button class="btn coral" id="ev-send">Add to calendar</button>
    </div>`;
  }

  function wireCalendar(){
    const months = $("#months");
    if(months) months.addEventListener("click", e=>{
      const b = e.target.closest("button[data-m]"); if(!b) return;
      SEL_MONTH = parseInt(b.dataset.m, 10);
      render();
    });
    const login = $("#ev-login");
    if(login) login.addEventListener("click", openLogin);
    const swap = $("#ev-swap");
    if(swap) swap.addEventListener("click", ()=>{
      evEgIx++;
      const eg = EVENT_EG[evEgIx % EVENT_EG.length];
      const n = $("#ev-name"), b = $("#ev-blurb");
      if(n) n.placeholder = eg.n;
      if(b) b.placeholder = eg.w(CITY.name);
    });

    const send = $("#ev-send");
    if(send){
      $("#ev-start").value = SEL_MONTH;
      $("#ev-end").value = SEL_MONTH;
      send.addEventListener("click", addEvent);
    }
  }

  async function addEvent(){
    const name = $("#ev-name").value.trim();
    const blurb = $("#ev-blurb").value.trim();
    const btn = $("#ev-send");
    const evSlot = html => { const s = $("#ev-slot"); if(s) s.innerHTML = html; };

    if(name.length < 3){ toast("Give the event a name"); $("#ev-name").focus(); return; }

    btn.disabled = true; btn.textContent = "Adding…";
    try{
      const { data, error } = await sb.from("city_events").insert({
        city_id: CITY.id,
        name,
        blurb: blurb || null,
        severity: $("#ev-sev").value,
        start_month: parseInt($("#ev-start").value, 10),
        end_month: parseInt($("#ev-end").value, 10),
        author_id: auth.me.id
      }).select("id,name,blurb,kind,severity,start_month,end_month").single();
      if(error) throw error;

      EVENTS.push(data);
      SEL_MONTH = data.start_month;
      render();
      toast("Added to the calendar");
    }catch(e){
      console.error(e);
      btn.disabled = false; btn.textContent = "Add to calendar";
      const blocked = moderationMessage(e);
      if(blocked) evSlot(`<div class="reject">${escapeHtml(blocked)}</div>`);
      else toast("Couldn't add that — try again");
    }
  }

  (async function init(){
    if(!CFG){ fail("That article type doesn't exist."); return; }
    if(!SLUG){ fail("No city specified."); return; }
    if(JUMP){ location.replace(addHref("")); return; }

    CITY = await T2.loadCity(SLUG);
    if(!CITY){ fail("We're not covering that city yet."); return; }
    document.title = `TripVibz · ${CFG.title(CITY.name)}`;

    if(THEME === "worst_times"){
      const { data: evs } = await sb.from("city_events")
        .select("*")      // includes source once the 20261021a migration is in
        .eq("city_id", CITY.id).eq("status", "approved");
      EVENTS = evs || [];
    }

    await auth.ensure();
    await T2.finishClaim();
    const { data: rows } = await sb.from("posts").select(T2.POST_COLS).eq("city_id", CITY.id).eq("type", THEME);
    ENTRIES = rows || [];
    CTX = await T2.hydrate(ENTRIES, CITY.id);
    render();
  })();
})();
</script>
</body>
</html>
