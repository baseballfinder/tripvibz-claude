<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripVibz · Place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/analytics.js"></script>
<style>
  :root{--maxw:820px}
  main{padding:22px 0 60px}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:14px}
  .back:hover{color:var(--ink)}

  .place-head h1{font-size:clamp(28px,4.6vw,40px);font-weight:900;margin:8px 0 8px}
  .place-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:500;align-items:center}
  .place-meta .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .place-meta .rating{font-family:"Archivo";font-weight:800;color:var(--ink)}

  .guide-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:26px 0 10px}
  @media(max-width:640px){.guide-cards{grid-template-columns:1fr}}
  .guide-card{display:block;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;text-decoration:none;transition:transform .1s ease,box-shadow .12s ease}
  .guide-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(22,20,15,.1)}
  .guide-card h3{font-size:18px;font-weight:800;margin:10px 0 6px}
  .guide-card p{font-size:13.5px;color:var(--muted);margin:0 0 12px;line-height:1.45}
  .guide-card .go{font-family:"Archivo";font-weight:700;font-size:13px;color:var(--ocean)}

  .section-label{font-family:"Archivo";font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:30px 2px 12px}
  .takes{display:flex;flex-direction:column;gap:12px}
  .take-row{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .take-row h4{font-family:"Archivo";font-size:16px;font-weight:800;margin:8px 0 5px}
  .take-row h4 a{color:inherit;text-decoration:none}
  .take-row h4 a:hover{color:var(--coral)}
  .take-row .meta{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="dot"></span>TripVibz</a>
    <nav class="nav-links">
      <a href="index.html">Feed</a>
      <a href="places.html">Places</a>
    </nav>
    <div class="nav-right"><div id="auth-slot"></div></div>
  </div>
</header>

<main>
  <div class="wrap">
    <a class="back" href="places.html">← Places</a>
    <div id="place"><div class="state"><b>Loading…</b>Pulling this place from the database.</div></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/tv.js"></script>
<script>
(function(){
  "use strict";
  const { sb, $, TYPE_LABEL, escapeHtml, timeAgo, auth } = window.TV;

  const PID = new URLSearchParams(location.search).get("id");

  const GUIDE_COPY = {
    what_not_to_do: { icon:"🚫", blurb:"The mistakes that cost people time, money, or a good night." },
    worst_times:    { icon:"⏰", blurb:"When it's packed, overpriced, closed, or just not worth it." }
  };

  function notFound(msg){
    $("#place").innerHTML = `<div class="state"><b>Place not found</b>${escapeHtml(msg)}<br><br><a href="places.html">← Browse places</a></div>`;
  }

  function guideCard(place, kind, n){
    const c = GUIDE_COPY[kind];
    const label = n ? `${n} contribution${n===1?'':'s'}` : "Be the first to add one";
    return `<a class="guide-card" href="guide.html?place=${place.id}&kind=${kind}">
      <span class="badge b-${kind}">${TYPE_LABEL[kind]}</span>
      <h3>${c.icon} ${TYPE_LABEL[kind]}</h3>
      <p>${c.blurb}</p>
      <div class="go">${label} →</div>
    </a>`;
  }

  async function cityHref(place){
    if(!place.city) return "places.html";
    try{
      const { data } = await sb.from("cities").select("slug").eq("name", place.city).maybeSingle();
      return data && data.slug ? `city.html?slug=${encodeURIComponent(data.slug)}` : "places.html";
    }catch(e){ return "places.html"; }
  }

  function render(place, posts){
    document.title = `TripVibz · ${place.name}`;
    const counts = {
      what_not_to_do: posts.filter(p=>p.type==="what_not_to_do").length,
      worst_times:    posts.filter(p=>p.type==="worst_times").length
    };
    const others = posts.filter(p=>p.type!=="what_not_to_do" && p.type!=="worst_times")
                        .sort((a,b)=>(b.ups-b.downs)-(a.ups-a.downs));

    const where = [place.neighborhood, place.city].filter(Boolean).join(", ");
    const rating = (place.review_count > 0)
      ? `<span class="pill"><span class="rating">★ ${Number(place.avg_rating).toFixed(1)}</span> · ${place.review_count} review${place.review_count===1?'':'s'}</span>`
      : "";

    $("#place").innerHTML = `
      <div class="place-head">
        <h1>${escapeHtml(place.name)}</h1>
        <div class="place-meta">
          ${where ? `<span class="pill">📍 ${escapeHtml(where)}</span>` : ""}
          ${place.category ? `<span class="pill">${escapeHtml(place.category)}</span>` : ""}
          ${rating}
        </div>
      </div>

      <div class="guide-cards">
        ${guideCard(place,"what_not_to_do",counts.what_not_to_do)}
        ${guideCard(place,"worst_times",counts.worst_times)}
      </div>

      ${others.length ? `
        <div class="section-label">Other takes here</div>
        <div class="takes">
          ${others.map(p=>`<div class="take-row">
            <span class="badge b-${p.type}">${TYPE_LABEL[p.type]||p.type}</span>
            <h4><a href="thread.html?id=${p.id}">${escapeHtml(p.title)}</a></h4>
            <div class="meta">▲ ${p.ups} · 💬 ${p.comment_count} · ${timeAgo(p.created_at)} ago</div>
          </div>`).join("")}
        </div>` : ""}
    `;
  }

  (async function init(){
    auth.ensure();
    if(!PID){ notFound("No place specified."); return; }

    const { data: place, error } = await sb.from("places")
      .select("id,name,city,neighborhood,category,avg_rating,review_count")
      .eq("id", PID).maybeSingle();
    if(error || !place){ notFound("That place doesn't exist or was removed."); return; }

    const { data: posts } = await sb.from("posts")
      .select("id,title,type,ups,downs,comment_count,created_at")
      .eq("place_id", PID);

    render(place, posts || []);

    const back = document.querySelector(".back");
    const href = await cityHref(place);
    back.href = href;
    back.textContent = href === "places.html" ? "← Places" : `← ${place.city}`;
  })();
})();
</script>
</body>
</html>
