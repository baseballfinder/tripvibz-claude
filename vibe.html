<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripVibz</title>
<!--fonts-->
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/v2.css">
<script src="/assets/analytics.js" defer></script>
<style>
  /* Vibe pages (/<city>/<vibe>/): pre-rendered by build.mjs (vibePageBody), no page script. */
  :root{--maxw:720px}
  main{padding:20px 0 70px}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:14px}
  .hd .kicker{font-family:"Archivo";font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--coral-ink)}
  .hd h1{font-size:clamp(27px,5.4vw,42px);font-weight:900;line-height:1.08;margin:11px 0 12px}
  .hd .lede{font-size:16.5px;color:#39352d;line-height:1.55;margin:0 0 6px}
  .hd .by{font-size:13px;color:var(--muted);font-weight:600}
  .vsec h2{font-family:"Archivo";font-weight:900;font-size:20px;margin:26px 0 10px}
  .vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .vlist li{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .vlist .t{font-weight:800;font-size:16.5px;color:var(--ink);text-decoration:none;line-height:1.35}
  .vlist .m{font-size:13px;color:var(--muted);margin-top:4px}
  .vcta{margin:26px 0 0;background:var(--sand);border-radius:16px;padding:16px}
  .vcta b{display:block;font-family:"Archivo";font-size:17px;margin-bottom:4px}
  .vcta a{color:var(--ink);font-weight:800}
  .vmore{margin-top:22px;font-size:14.5px;color:var(--muted)}
  .vmore a{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/"><img class="brand-mark" src="/assets/brand/mark.svg" width="30" height="30" alt="">TripVibz</a>
    <nav class="nav-links"><a href="/cities/">Cities</a></nav>
    <div class="nav-right"></div>
  </div>
</header>
<main class="wrap"><div id="root"></div></main>
</body>
</html>
