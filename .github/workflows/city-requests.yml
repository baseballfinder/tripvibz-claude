# City requests: email James (via a GitHub issue that @mentions him) when a
# requested city reaches 5 asks, and open the city when he labels the issue
# "approved". Logic lives in scripts/city_requests_bot.py.
#
# Uses the SUPABASE_DB_URL secret already set for the nightly backup.

name: City requests

on:
  schedule:
    - cron: "23 * * * *"   # hourly
  workflow_dispatch: {}
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: city-requests
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet -r scripts/requirements.txt
      - name: Open an issue for each city that reached 5 asks
        env:
          # The limited bot role (supabase/migrations/20261030010000_bot_role.sql); full URL until BOT_DB_URL is set.
          SUPABASE_DB_URL: ${{ secrets.BOT_DB_URL || secrets.SUPABASE_DB_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/city_requests_bot.py notify

  open:
    if: github.event_name == 'issues' && github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'city-request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install --quiet -r scripts/requirements.txt
      - name: Add the city and its starter questions
        id: city
        env:
          # The limited bot role (supabase/migrations/20261030010000_bot_role.sql); full URL until BOT_DB_URL is set.
          SUPABASE_DB_URL: ${{ secrets.BOT_DB_URL || secrets.SUPABASE_DB_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/city_requests_bot.py open
      - name: Build its share card and open a pull request
        if: steps.city.outputs.slug != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.city.outputs.slug }}
          NAME: ${{ steps.city.outputs.name }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # main is protected (pull request + passing tests), so the new city's
          # share card goes up as a pull request. Pull requests opened with this
          # token don't start other workflows, so the tests are started by hand.
          python3 scripts/og_cards.py "$SLUG"
          BRANCH="city/$SLUG"
          git config user.name "tripvibz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add assets/og
          git commit -m "Open $NAME: share card" || echo "no card change"
          git push -f origin "$BRANCH"
          PR=$(gh pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" \
            --title "Open $NAME" --body "$NAME is live in the database with 5 starter questions. Merge this to publish its page and Facebook share card. Closes #$ISSUE." || true)
          gh workflow run tests.yml --repo "${{ github.repository }}" --ref "$BRANCH"
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body "@baseballfinder $NAME is added. Last step: merge ${PR:-the \"Open $NAME\" pull request} once its tests pass, and the page goes live at https://www.tripvibz.com/$SLUG/. Ask Claude for sharper local questions any time."
