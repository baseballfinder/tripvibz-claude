# Runs the TripVibz test plan (tests/README.md) on every pull request and on
# every merge to main. Read-only against the live database: the end-to-end
# tests intercept every write, so nothing is posted, voted or requested.
#
# One job, one required check ("test"): build → static → security → performance
# budgets → end-to-end → CSP in a browser → Lighthouse → database policy lint.

name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Read-only use (tests/db-security.sql). Empty on forks, and the lint step skips itself.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          pip install --quiet -r scripts/requirements.txt

      # ---- security: dependencies with known vulnerabilities fail the build ----
      - name: Dependency audit (high or critical advisories fail)
        run: npm audit --omit=dev --audit-level=high

      - name: Build the site
        run: node build.mjs

      - name: Static checks (pages, links, share cards, questions, logo)
        run: node tests/static.mjs

      - name: Security checks (headers, CSP, no secrets, workflows, API input handling)
        run: node tests/security.mjs

      - name: Performance budgets (page, script, style, font and image sizes; nothing blocks first paint)
        run: node tests/perf.mjs

      - name: Structured data (schema.org types/properties, Google rich-result fields, same-page references)
        run: node tests/schema.mjs

      - name: End-to-end (every feature in a real browser, writes intercepted)
        run: node tests/e2e.mjs

      - name: Content-Security-Policy enforced in a real browser on every page type
        run: node tests/csp.mjs

      # ---- performance: Lighthouse scores, Core Web Vitals and resource budgets ----
      - name: Lighthouse, desktop (lighthouserc.json; uses the runner's Chrome)
        run: npx lhci autorun
      - name: Lighthouse, mobile (lighthouserc.mobile.json; PageSpeed's phone emulation)
        run: npx lhci autorun --config=lighthouserc.mobile.json
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/*.html
            .lighthouseci/mobile/*.html
          retention-days: 14

      # ---- security: database rules (read-only catalog lint, needs the DB URL secret) ----
      - name: Database policy lint (skipped when the secret isn't available, e.g. a fork)
        if: env.SUPABASE_DB_URL != ''
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f tests/db-security.sql
