# Keeps supabase/schema.sql — a schema-only dump of the live database (public
# schema: tables, policies, triggers, functions, grants) — in the repo, so the
# database can be rebuilt from git. Many early migrations here are placeholders
# for changes applied by hand; this file is the real, current shape.
#
# Weekly and on demand. When the dump differs from the committed file it opens
# (or refreshes) a pull request on the branch "schema-snapshot" — the normal
# test check runs on it and nothing lands on main without review.
#
# Rebuild from scratch:  psql "$NEW_DB_URL" -f supabase/schema.sql
# then apply any migration newer than the date in the file's header.

name: Schema snapshot

on:
  schedule:
    - cron: "23 9 * * 1"   # Mondays 5:23 am Eastern (daylight time)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: schema-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pg_dump 17 (must match the server's Postgres 17)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Dump the public schema
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "::error::SUPABASE_DB_URL secret missing"; exit 1; }
          {
            echo "-- TripVibz database schema (public) — generated by .github/workflows/schema-snapshot.yml on $(date -u +%F)."
            echo "-- Do not edit by hand: change the database through supabase/migrations/ and this file follows."
            /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --schema-only --no-owner --schema=public \
              | grep -vE '^-- Dumped (from|by)|^\\restrict|^\\unrestrict|^SET (statement_timeout|lock_timeout|idle_in_transaction_session_timeout|transaction_timeout|client_encoding|standard_conforming_strings|check_function_bodies|xmloption|client_min_messages|row_security) '
          } > supabase/schema.sql
          wc -l supabase/schema.sql
      - name: Open or refresh the snapshot pull request when it changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: schema-snapshot
          commit-message: "Schema snapshot (automated)"
          title: "Schema snapshot: the live database changed"
          body: |
            `supabase/schema.sql` differs from the live database (a migration landed or something was changed by hand).
            Review the diff; merging keeps the repo's copy of the schema current. Nothing in this PR changes the database.
          labels: automated
          delete-branch: true
