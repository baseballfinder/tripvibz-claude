# Loads eat-and-drink places near every TripVibz city into places_catalog from
# Overture Maps' open places data (CDLA-Permissive 2.0), so the top-3 picker
# offers real names with address, phone, website and coordinates. Monthly,
# after Overture's release (third week), and on demand. Logic: scripts/places_catalog.py
#
# A new city gets its places without anyone remembering to ask: every merge that
# opens a city (its share cards change) and a daily run load any city that has
# none yet ("--missing"). Atlanta opened on 19 Nov 2026 with an empty restaurant
# picker and Guide because this only ran monthly.
#
# First run after the migration lands: Actions → "Places catalogue" → Run workflow.

name: Places catalogue

on:
  schedule:
    - cron: "17 10 25 * *"   # 25th of the month, 6:17 am Eastern (daylight time): every city
    - cron: "41 9 * * *"     # daily: only cities that have no places yet
  push:
    branches: [main]
    paths:
      - "assets/og/cards.json"          # changes whenever a city is opened
      - ".github/workflows/places-catalog.yml"
      - "scripts/places_catalog.py"
  workflow_dispatch:
    inputs:
      city:
        description: "One city slug (blank = every city)"
        required: false
        default: ""
      release:
        description: "Overture release, e.g. 2026-10-21.0 (blank = latest)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: places-catalog
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet -r scripts/requirements.txt
      - name: Load places for each city
        env:
          # The limited bot role (supabase/migrations/20261030010000_bot_role.sql); full URL until BOT_DB_URL is set.
          SUPABASE_DB_URL: ${{ secrets.BOT_DB_URL || secrets.SUPABASE_DB_URL }}
          PLACES_RELEASE: ${{ inputs.release }}
          # Monthly run and a manual run with no city: everything. Daily run and merges: only cities with none.
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.city || ((github.event_name == 'push' || github.event.schedule == '41 9 * * *') && '--missing' || '') }}
        run: python3 scripts/places_catalog.py "$ONLY"
