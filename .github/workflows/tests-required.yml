# "New code comes with tests" (CLAUDE.md, tests/README.md).
#
# Fails a pull request that changes site code (app pages, their scripts, the
# build, functions, migrations, maintenance scripts) without changing any test.
# The rule lives in scripts/tests-included.mjs and is itself tested in
# tests/static.mjs. For a real exception, add the "no-tests-needed" label
# (the check re-runs when a label is added or removed).

name: Tests included

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tests-included-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests-included:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Site code changes come with a test
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' \
            | node scripts/tests-included.mjs
