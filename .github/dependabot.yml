# Keeps dependencies current with small weekly pull requests; the "test" check
# validates each one before it can merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    groups:
      dev-tooling: { patterns: ["esbuild", "playwright", "@lhci/*", "sharp", "@fontsource-variable/*"] }
      # The client is bundled from these three at one version (lib/supabase-client.mjs); bump them together.
      supabase: { patterns: ["@supabase/*"] }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /scripts
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
