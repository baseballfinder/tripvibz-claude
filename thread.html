<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripVibz · Take</title>
<link rel="preconnect" href="https://nkxorlktzbgwqnfwmuus.supabase.co" crossorigin>
<!--fonts-->
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/v2.css">
<script src="/assets/analytics.js" defer></script>
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/"><img class="brand-mark" src="/assets/brand/mark.svg" width="30" height="30" alt="">TripVibz</a>
    <div class="nav-right"><div id="auth-slot"></div></div>
  </div>
</header>

<main class="v2" id="root" style="padding-bottom:0"><div class="state"><b>Loading…</b></div></main>
<div class="toast" id="toast"></div>

<script src="/assets/supabase.js"></script>
<script src="/assets/tv.js"></script>
<script src="/assets/v2.js"></script>
<script>
(function(){
  "use strict";
  const { sb, $, escapeHtml: esc, auth, toast, moderationMessage, timeAgo } = window.TV;
  const T2 = window.TV2;
  // Shared links are /t/<id> (functions/t/[id].js adds the link preview); /thread.html?id= still works.
  const PID = new URLSearchParams(location.search).get("id") || (location.pathname.match(/^\/t\/([0-9a-f-]{36})/i) || [])[1] || null;
  const KINDS = { agree: "Agree", context: "Adds context", disagree: "Disagree" };
  const ASK = { agree: "Agree, and…", context: "Add context", disagree: "I disagree" };
  const PH = { agree: "Add to it…", context: "What should visitors also know?", disagree: "Why is it wrong?" };

  let POST = null, CITY = null, CTX = null, COMMENTS = [], FILTER = "all", KIND = "agree", REPLY_TO = "";

  function replyHtml(c){
    const depth = c.path.split(".").length - 1;
    const verified = c.author_verified && c.author_id;
    const me = auth.me && c.author_id === auth.me.id;
    const name = !verified ? "Anonymous" : me ? "You" : T2.shortName(CTX.profiles[c.author_id]);
    const badge = verified ? T2.localBadge(c.author_id, CTX) : `<span class="bdg unv">Unverified</span>`;
    return `<div class="reply${depth ? " nested" : ""}">
      <div class="who" style="margin:0 0 6px">${c.kind ? `<span class="rk ${c.kind}">${KINDS[c.kind]}</span>` : ""}<b>${esc(name)}</b>${badge}<span>· ${T2.ago(c.created_at)}</span></div>
      <div style="font-size:15px;line-height:1.45;white-space:pre-wrap">${esc(c.body)}</div>
      ${depth ? "" : `<button class="link-btn" data-reply="${esc(c.path)}" style="min-height:36px;padding:0">Reply</button>`}
    </div>`;
  }

  function ordered(){
    const top = COMMENTS.filter(c => !c.path.includes(".")).filter(c => FILTER === "all" || c.kind === FILTER);
    top.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
    const out = [];
    top.forEach(t => { out.push(t); COMMENTS.filter(c => c.path.startsWith(t.path + ".")).sort((a,b) => new Date(a.created_at) - new Date(b.created_at)).forEach(r => out.push(r)); });
    return out;
  }

  function render(){
    const v = CTX.myVotes[POST.id] || 0;
    const tot = POST.ups + POST.downs, up = tot ? Math.round(100 * POST.ups / tot) : 50;
    const list = ordered();
    $("#root").innerHTML = `
      <a class="back" href="/${CITY.slug}/" style="margin-top:6px">← ${esc(CITY.name)}</a>
      <div style="margin:6px 0 0">${T2.takeHtml(POST, CTX, { noBar: true, noLink: true, city: CITY.id ? CITY : null, placement: "take_page" })}</div>
      <div class="take" style="margin-top:-12px;border-top:none;border-top-left-radius:0;border-top-right-radius:0;padding-top:4px">
        <div class="row-between" style="font-size:13px;font-weight:700;margin-bottom:6px"><span>${tot ? up + "% say true" : "No votes yet"}</span><span style="color:#1f4fa3">${tot ? (100 - up) + "% say nope" : ""}</span></div>
        <div class="rbar" aria-hidden="true"><i style="width:${up}%;background:var(--ink)"></i><i style="width:${100 - up}%;background:#1f4fa3"></i></div>
        <div class="big2">
          <button class="yes" data-vote="1" aria-pressed="${v === 1}">True · ${POST.ups}</button>
          <button class="no" data-vote="-1" aria-pressed="${v === -1}">Nope · ${POST.downs}</button>
        </div>
        <div class="share-cta">
          <p><b>${v ? "You voted. Do your friends agree?" : "Do your friends agree?"}</b>Send it to someone who knows ${esc(CITY.name)}.</p>
          <button id="share-take">${T2.ICON.share}Share</button>
        </div>
      </div>

      <div class="row-between" style="margin:20px 0 10px">
        <h2 style="font-size:16px;font-weight:800">${COMMENTS.length} repl${COMMENTS.length === 1 ? "y" : "ies"}</h2>
        <div class="seg" role="group" aria-label="Filter replies">${[["all","All"],["agree","Agree"],["disagree","Disagree"]].map(([id,l]) => `<button data-filter="${id}" aria-pressed="${FILTER === id}">${l}</button>`).join("")}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">${list.length ? list.map(replyHtml).join("") : `<div class="empty2">No replies yet. Agree, add context, or tell them they're wrong.</div>`}</div>

      <div class="composer">
        ${REPLY_TO ? `<div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">Replying to a comment · <button class="link-btn" id="cancel-reply" style="padding:0">cancel</button></div>` :
        `<div class="chips" role="group" aria-label="Reply type" style="padding:0 0 8px">${Object.keys(ASK).map(k => `<button class="chip" data-kind="${k}" aria-pressed="${KIND === k}" style="min-height:36px">${ASK[k]}</button>`).join("")}</div>`}
        <div style="display:flex;gap:8px;align-items:center">
          <label for="reply" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Your reply</label>
          <input id="reply" class="inp" autocapitalize="sentences" autocorrect="on" spellcheck="true" style="flex:1;min-height:46px;background:var(--paper)" maxlength="1000" placeholder="${esc(REPLY_TO ? "Your reply…" : PH[KIND])}">
          <button class="send" id="send" aria-label="Send reply"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
        ${auth.me && auth.me.is_anonymous ? `<div style="font-size:12px;color:var(--muted);margin-top:6px">Replying as Anonymous. <a href="#" id="signin" style="color:var(--ink);font-weight:700">Sign in</a> to show your Local badge.</div>` : ""}
      </div>`;
    wire();
  }

  function wire(){
    const root = $("#root");
    root.querySelectorAll("[data-vote]").forEach(b => b.onclick = async () => { await T2.castVote(POST, CTX, Number(b.dataset.vote)); render(); });
    root.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { FILTER = b.dataset.filter; render(); });
    root.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { KIND = b.dataset.kind; render(); $("#reply").focus(); });
    root.querySelectorAll("[data-reply]").forEach(b => b.onclick = () => { REPLY_TO = b.dataset.reply; render(); $("#reply").focus(); });
    const cr = $("#cancel-reply"); if (cr) cr.onclick = () => { REPLY_TO = ""; render(); };
    const si = $("#signin"); if (si) si.onclick = e => { e.preventDefault(); T2.signInForBadge(); };
    $("#share-take").onclick = () => T2.share(T2.takeShare(POST, CITY.slug === "cities" ? "" : CITY.name));
    $("#send").onclick = send;
    $("#reply").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  }

  async function send(){
    const body = window.TV.tidy(($("#reply").value || "").trim());
    if (body.length < 2) { toast("Write something first"); return; }
    if (!(await auth.session())) { toast("That didn't go through. Try again."); return; }
    const id = crypto.randomUUID();
    const label = id.replace(/-/g, "");
    const path = REPLY_TO ? REPLY_TO + "." + label : label;
    const row = { id, post_id: POST.id, author_id: auth.me.id, body, path, kind: REPLY_TO ? null : KIND };
    const r = await sb.from("comments").insert(row).select("id,author_id,author_verified,body,path,kind,created_at").single();
    if (r.error) {
      console.error(r.error);
      toast(moderationMessage(r.error) || (/RATE_LIMITED/.test(r.error.message) ? "That's a lot of replies today. Sign in to keep going." : "That didn't post. Try again."));
      return;
    }
    COMMENTS.push(r.data); POST.comment_count++; REPLY_TO = ""; render();
    toast("Posted");
  }

  (async function init(){
    if (!PID) { $("#root").innerHTML = `<div class="state"><b>Take not found</b><a href="/cities/">Browse cities</a></div>`; return; }
    await auth.ensure();
    await T2.finishClaim();
    const r = await sb.from("posts").select(T2.POST_COLS).eq("id", PID).maybeSingle();
    if (!r.data) { $("#root").innerHTML = `<div class="state"><b>Take not found</b>It may have been removed.<br><br><a href="/cities/">Browse cities</a></div>`; return; }
    POST = r.data;
    const [c, cm] = await Promise.all([
      sb.from("cities").select("id,name,state,slug,lat,lng").eq("id", POST.city_id).maybeSingle(),
      sb.from("comments").select("id,author_id,author_verified,body,path,kind,created_at").eq("post_id", PID)
    ]);
    CITY = c.data || { name: "All cities", slug: "cities" };
    COMMENTS = cm.data || [];
    CTX = await T2.hydrate([POST], POST.city_id, COMMENTS.filter(x => x.author_verified && x.author_id).map(x => x.author_id));
    document.title = `${POST.title} · TripVibz`;
    render();
  })();
})();
</script>
</body>
</html>
