<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripVibz · City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://nkxorlktzbgwqnfwmuus.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/v2.css">
<script src="/assets/analytics.js"></script>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/"><span class="dot"></span>TripVibz</a>
    <nav class="nav-links"><a href="/cities/" class="active">Cities</a></nav>
    <div class="nav-right"><div id="auth-slot"></div></div>
  </div>
</header>

<main class="v2">
  <div id="city"><div class="state"><b>Loading…</b></div></div>
</main>

<a class="fab" id="fab" href="#" hidden>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  <span id="fab-text">What do tourists get wrong here?</span>
</a>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/tv.js"></script>
<script src="/assets/v2.js"></script>
<script>
(function(){
  "use strict";
  const { sb, $, escapeHtml: esc, auth } = window.TV;
  const T2 = window.TV2;
  const SLUG = window.TV.parseRoute().city;
  const PHOTO_BASE = "https://nkxorlktzbgwqnfwmuus.supabase.co/storage/v1/object/public/city-photos/";
  // Attribution for openly licensed hero photos (Wikimedia Commons etc.).
  const PHOTO_CREDIT = {
  };

  const SECTIONS = [["all","Everything"],["what_not_to_do","What not to do"],["worst_times","Worst times"],["hidden_gem","What locals do"]];
  let CITY = null, POSTS = [], CTX = null, QS = [], SECTION = "all", SORT = "top";

  try { const s = new URLSearchParams(location.search).get("s"); if (s && SECTIONS.some(x => x[0] === s)) SECTION = s; } catch (e) {}

  function questionCard(){
    if (!QS.length) return "";
    const q = QS.find(x => !x.mine) || null;
    const base = `/${CITY.slug}/vote/`;
    if (!q) {
      const last = QS[0];
      return `<div class="qcard"><div class="qk">You've answered every question</div>
        <div class="qp">${esc(last.prompt)}</div>
        <div class="qopts">${T2.qOptionsHtml(last, true, base)}</div>
        <div class="qnote">${T2.qTotal(last)} votes so far. New questions every week.</div></div>`;
    }
    const total = T2.qTotal(q);
    return `<div class="qcard"><div class="qk">Locals, settle this</div>
      <div class="qp">${esc(q.prompt)}</div>
      <div class="qopts">${T2.qOptionsHtml(q, true, base)}</div>
      <div class="qnote">One tap. ${total ? `See what ${total} other ${total === 1 ? "person" : "people"} said.` : "Be the first to answer."}</div></div>`;
  }

  function render(){
    const list = T2.sortPosts(POSTS.filter(p => SECTION === "all" || p.type === SECTION), SORT);
    const locals = new Set(POSTS.filter(p => p.author_verified && p.author_id).map(p => p.author_id)).size;
    const votes = POSTS.reduce((s,p) => s + p.ups + p.downs, 0) + QS.reduce((s,q) => s + T2.qTotal(q), 0);
    $("#city").innerHTML = `
      <a class="back" href="/cities/">← All cities</a>
      <img class="city-hero" src="${PHOTO_BASE}${encodeURIComponent(CITY.photo || CITY.slug + ".webp")}" alt="${esc(CITY.name)}" width="800" height="500" onerror="this.nextElementSibling && this.nextElementSibling.classList.contains('photo-credit') && this.nextElementSibling.remove(); this.remove()">
      ${PHOTO_CREDIT[CITY.slug] ? `<a class="photo-credit" href="${PHOTO_CREDIT[CITY.slug][1]}" target="_blank" rel="noopener">Photo: ${esc(PHOTO_CREDIT[CITY.slug][0])}</a>` : ""}
      <div class="kicker">${esc(CITY.name)}${CITY.state ? ", " + esc(CITY.state) : ""}</div>
      <h1>What locals say about ${esc(CITY.name)}</h1>
      ${POSTS.length || votes ? `<div class="stats"><span>${POSTS.length} take${POSTS.length === 1 ? "" : "s"}</span><span>${locals} local${locals === 1 ? "" : "s"}</span><span>${votes} vote${votes === 1 ? "" : "s"}</span></div>` : ""}
      <div style="height:14px"></div>
      ${questionCard()}
      <nav class="chips" aria-label="Sections">${SECTIONS.map(([id,l]) => `<button class="chip" data-sec="${id}" aria-pressed="${SECTION===id}">${l}</button>`).join("")}</nav>
      <div class="row-between" style="margin:2px 0 12px">
        <div class="seg" role="group" aria-label="Sort">${[["top","Top"],["hot","Hot"],["new","New"]].map(([id,l]) => `<button data-sort="${id}" aria-pressed="${SORT===id}">${l}</button>`).join("")}</div>
        <span style="font-size:12.5px;color:var(--muted);font-weight:600">${CTX.founderCount}/10 founding locals</span>
      </div>
      <div class="feed" id="feed">${list.length ? list.map((p, i) => T2.takeHtml(p, CTX, { city: CITY, placement: "feed" }) +
          (i === 2 ? T2.stay22MapHtml(CITY, "city-feed") : "")).join("") :
        `<div class="empty2"><b>No takes here yet</b>Live in ${esc(CITY.name)}? Tell visitors what they get wrong. One sentence is enough, and the first 10 signed-in locals are its founding locals.</div>`}</div>
      ${list.length < 3 ? T2.stay22MapHtml(CITY, "city-feed") : ""}`;
    wire();
    T2.mountStay22($("#city"));
  }

  function wire(){
    $("#city").querySelectorAll("[data-sec]").forEach(b => b.addEventListener("click", () => { SECTION = b.dataset.sec; render(); }));
    $("#city").querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => { SORT = b.dataset.sort; render(); }));
    $("#feed").addEventListener("click", async e => {
      const b = e.target.closest("[data-vote]"); if (!b) return;
      const p = POSTS.find(x => x.id === b.dataset.id); if (!p) return;
      await T2.castVote(p, CTX, Number(b.dataset.vote));
      const card = b.closest(".take"); card.outerHTML = T2.takeHtml(p, CTX, { city: CITY, placement: "feed" });
    });
  }

  (async function init(){
    if (!SLUG) { $("#city").innerHTML = `<div class="state"><b>No city</b><a href="/cities/">Pick a city</a></div>`; return; }
    CITY = await T2.loadCity(SLUG);
    if (!CITY) { $("#city").innerHTML = `<div class="state"><b>City not found</b><a href="/cities/">← All cities</a></div>`; return; }
    document.title = `What locals say about ${CITY.name} · TripVibz`;
    const fab = $("#fab"); fab.href = `/${CITY.slug}/add/`; fab.hidden = false;
    await auth.ensure();
    await T2.finishClaim();
    const r = await sb.from("posts").select(T2.POST_COLS).eq("city_id", CITY.id).in("type", ["what_not_to_do","worst_times","hidden_gem"]);
    POSTS = r.data || [];
    [CTX, QS] = await Promise.all([T2.hydrate(POSTS, CITY.id), T2.loadQuestions(CITY.id)]);
    render();
  })();
})();
</script>
</body>
</html>
