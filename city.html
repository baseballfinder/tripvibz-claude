<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripVibz · City</title>
<link rel="preconnect" href="https://nkxorlktzbgwqnfwmuus.supabase.co" crossorigin>
<!--fonts-->
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/v2.css">
<script src="/assets/analytics.js" defer></script>
<style>
/* City page layout: a hero band with the title on it, then one section at a time
   (Takes · Eat · When to go · Stay). build.mjs cityBody mirrors the skeleton. */
.hero-band{position:relative;margin:10px 0 14px;border-radius:14px;overflow:hidden;background:#efe9dd}
.hero-band .city-hero{display:block;width:100%;height:auto;margin:0;border-radius:0;aspect-ratio:2/1;max-height:none;object-fit:cover}
.hero-txt{position:absolute;left:0;right:0;bottom:0;padding:48px 14px 12px;color:#fff;background:linear-gradient(to top,rgba(10,9,7,.82) 0%,rgba(10,9,7,.45) 55%,rgba(10,9,7,0) 100%)}
.hero-txt .kicker{color:#fff;opacity:.9;font-size:11px;letter-spacing:.12em}
.hero-txt h1{color:#fff;font-size:clamp(22px,5.6vw,30px);margin:2px 0;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.hero-n{font-size:13px;opacity:.92}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--sand);border-radius:12px;padding:4px;margin:0 0 14px}
.tabs [role=tab]{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--ink);font:600 13.5px "Public Sans",sans-serif;cursor:pointer;padding:0 4px;white-space:nowrap}
.tabs [role=tab][aria-selected=true]{background:var(--ink);color:#fff;font-weight:700}
.tabs [role=tab]:focus-visible{outline:2px solid var(--coral-ink);outline-offset:-2px}
.panel>*:first-child{margin-top:0}
/* The question card, light: the page already has one dark block (the hero) */
.qcard.lite{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin:0 0 12px}
.qcard.lite .qk{color:var(--muted);font-size:11px}
.qcard.lite .qp{font-size:16.5px;line-height:1.25;margin:6px 0 10px}
.qcard.lite .qopts{flex-direction:row;flex-wrap:wrap;gap:8px}
.qcard.lite .qopt{min-height:40px;padding:0 14px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-size:14px;font-weight:600;border-radius:999px}
.qcard.lite .qopt .fill{display:none}
.qcard.lite .qnote{color:var(--muted);margin-top:8px}
.panel .editors{margin-bottom:12px}
.panel .chips{padding-top:0}
.more-topics{font-size:13px;color:var(--muted);margin:14px 2px 0}
.more-topics a{color:var(--ink);font-weight:700;text-decoration:none;white-space:nowrap}
.more-topics a:hover{text-decoration:underline}
.panel .when{margin:0}
.panel .s22{margin-top:0}
.stay-tips{margin-top:16px}
.stay-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.stay-links .s22-link{margin:0}
/* Know the city? Add your take: one fixed bar, in reach of a thumb */
.cta-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(251,250,247,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.cta-t{font-size:13px;color:var(--muted);line-height:1.3}
.cta-t small{display:block;font-size:12px;color:var(--coral-ink);font-weight:700}
.cta-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:12px;background:var(--coral-btn);color:#fff;font:800 15px "Public Sans",sans-serif;text-decoration:none;white-space:nowrap}
@media(min-width:900px){.cta-bar{left:auto;right:24px;bottom:24px;max-width:none;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(22,20,15,.14)}}
/* Locals' top 3 restaurants (city pages only; build.mjs eatsHtml mirrors the markup) */
.eats{margin:0 0 6px}
.eats-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.eats-h h2{font:900 20px "Archivo",sans-serif;margin:0;color:var(--ink)}
.eats-n{font-size:12.5px;font-weight:600;color:var(--muted)}
.eats-list{list-style:none;counter-reset:eat;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.eats-list li{counter-increment:eat;display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.eats-list li::before{content:counter(eat);flex:none;width:28px;height:28px;border-radius:999px;background:var(--ink);color:#fff;font:800 13px/28px "Archivo",sans-serif;text-align:center}
.eat-main{min-width:0;flex:1}
.eat-name{font:800 16px "Archivo",sans-serif;color:var(--ink)}
.eat-nb{font-size:12.5px;color:var(--muted);margin-left:8px}
.eat-meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.eat-why{font-size:14px;line-height:1.45;color:#2b2720;margin-top:6px}
.eat-by{color:var(--muted);font-size:12.5px;white-space:nowrap}
.eats-add{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.btn2{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:10px;background:var(--ink);color:#fff;font:800 14px "Public Sans",sans-serif;text-decoration:none;border:0;cursor:pointer}
.btn2.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.eats-note{font-size:12.5px;color:var(--muted)}
.eats-note a{color:inherit}
/* the picker */
.top3{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:10px}
.top3 h3{font:800 15px "Archivo",sans-serif;margin:0 0 4px;color:var(--ink)}
.top3 p{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.top3-row{display:grid;grid-template-columns:28px 1fr;gap:8px 10px;align-items:start;margin-bottom:10px}
.top3-row .n{width:28px;height:28px;border-radius:999px;background:#ece6da;color:var(--ink);font:800 13px/28px "Archivo",sans-serif;text-align:center;margin-top:7px}
.top3-row input{width:100%;box-sizing:border-box;border:1.5px solid #d9d1c2;border-radius:12px;padding:10px 12px;font:16px/1.4 "Public Sans",sans-serif;background:var(--paper,#faf8f4);color:var(--ink)}
.top3-row input+input{margin-top:6px;font-size:14px}
.top3-row input:focus{outline:2px solid var(--ink);outline-offset:1px;background:#fff}
.top3-acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.top3-field{position:relative}
.top3-sugg{position:absolute;left:0;right:0;top:46px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(22,20,15,.14);overflow:hidden}
.top3-sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;font:14.5px/1.3 "Public Sans",sans-serif;color:var(--ink);cursor:pointer;border-top:1px solid var(--line)}
.top3-sugg button:first-child{border-top:0}
.top3-sugg button:hover,.top3-sugg button:focus{background:#f6f3ec;outline:none}
.top3-sugg button b{display:block;font-weight:700}
.top3-sugg button small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.top3-sugg button.typed{color:#4e5a55}
.sugg-k{font:800 11px "Archivo",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px 2px}
.top3-picked{font-size:12.5px;color:#0b5c4c;margin:5px 2px 0;font-weight:600}
.top3-picked.plain{color:var(--muted);font-weight:500}
.eat-links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;font-weight:700}
.eat-links a{color:var(--ocean,#0b5c4c);text-decoration:none}
.eat-links a:hover{text-decoration:underline}
.eats-attrib{font-size:11.5px;color:var(--muted);margin-top:8px}
.eats-attrib a{color:inherit}
.top3 .err{color:#a52d15;font-size:13.5px;font-weight:600;margin:4px 0}
.top3 .ok{color:#0c6b5e;font-size:13.5px;font-weight:600;margin:4px 0}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/"><img class="brand-mark" src="/assets/brand/mark.svg" width="30" height="30" alt="">TripVibz</a>
    <nav class="nav-links"><a href="/cities/" class="active">Cities</a></nav>
    <div class="nav-right"><div id="auth-slot"></div></div>
  </div>
</header>

<main class="v2">
  <div id="city"><div class="state"><b>Loading…</b></div></div>
</main>


<div class="toast" id="toast"></div>

<script src="/assets/supabase.js"></script>
<script src="/assets/tv.js"></script>
<script src="/assets/v2.js"></script>
<script src="/assets/city.js"></script>
</body>
</html>
