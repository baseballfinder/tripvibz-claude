<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripVibz · City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/analytics.js"></script>
<style>
  main{padding:22px 0 60px}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:14px}
  .back:hover{color:var(--ink)}

  .city-head h1{font-size:clamp(28px,4.6vw,42px);font-weight:900;margin:8px 0 8px}
  .city-head .blurb{color:var(--muted);font-size:15.5px;max-width:60ch;margin:0}
  .city-head .pill{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);font-weight:600;margin-top:10px}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px}
  .filters button{font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:6px 13px;cursor:pointer;font-family:"Public Sans"}
  .filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .filters button:hover{border-color:#bdb4a3}

  .count-line{font-size:13px;color:var(--muted);font-weight:600;margin:16px 2px 12px}
  .place-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .place-card{display:block;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;text-decoration:none;transition:transform .1s ease,box-shadow .12s ease}
  .place-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(22,20,15,.1)}
  .place-card h3{font-size:17.5px;font-weight:800;margin-bottom:4px}
  .place-card .hood{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .place-card .tally{display:flex;gap:6px;flex-wrap:wrap}
  .place-card .tag{font-family:"Archivo";font-weight:700;font-size:11px;letter-spacing:.04em;padding:3px 8px;border-radius:999px}
  .place-card .none{font-size:12.5px;color:var(--muted);font-weight:600}

  .cta{background:var(--ink);color:#fff;border-radius:var(--radius);padding:20px 22px;margin:24px 0 6px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .cta h3{font-size:18px;font-weight:800;color:#fff;margin-bottom:5px}
  .cta p{font-size:13.5px;color:#bdb7a9;margin:0;max-width:46ch;line-height:1.45}
  .cta .btn{background:var(--coral);margin-left:auto;white-space:nowrap}
  @media(max-width:560px){.cta .btn{margin-left:0;width:100%;text-align:center}}

  .citywide{display:flex;flex-direction:column;gap:10px}
  .cw{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px}
  .cw .t{font-size:14.5px;color:#3d3931;line-height:1.5}
  .cw .m{font-size:12px;color:var(--muted);margin-top:7px}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="dot"></span>TripVibz</a>
    <nav class="nav-links">
      <a href="index.html">Feed</a>
      <a href="places.html" class="active">Places</a>
    </nav>
    <div class="nav-right"><div id="auth-slot"></div></div>
  </div>
</header>

<main>
  <div class="wrap">
    <a class="back" href="places.html">← All cities</a>
    <div id="city"><div class="state"><b>Loading…</b>Pulling this city from the database.</div></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/tv.js"></script>
<script>
(function(){
  "use strict";
  const { sb, $, TYPE_LABEL, escapeHtml, auth } = window.TV;

  const SLUG = new URLSearchParams(location.search).get("slug");

  let CITY = null, PLACES = [], CITYWIDE = [], FILTER = "all";

  function notFound(msg){
    $("#city").innerHTML = `<div class="state"><b>City not found</b>${escapeHtml(msg)}<br><br><a href="places.html">← All cities</a></div>`;
  }

  function placeCard(p){
    const tags = [];
    if(p.counts.what_not_to_do) tags.push(`<span class="tag b-what_not_to_do">${p.counts.what_not_to_do} what not to do</span>`);
    if(p.counts.worst_times)    tags.push(`<span class="tag b-worst_times">${p.counts.worst_times} worst times</span>`);
    const other = p.counts.total - p.counts.what_not_to_do - p.counts.worst_times;
    if(other) tags.push(`<span class="tag b-take">${other} other take${other===1?'':'s'}</span>`);

    return `<a class="place-card" href="place.html?id=${p.id}">
      <h3>${escapeHtml(p.name)}</h3>
      <div class="hood">${escapeHtml([p.neighborhood, p.category].filter(Boolean).join(" · ") || "—")}</div>
      <div class="tally">${tags.length ? tags.join("") : '<span class="none">No takes yet — add the first</span>'}</div>
    </a>`;
  }

  function visible(){
    if(FILTER === "all") return PLACES;
    if(FILTER === "has_takes") return PLACES.filter(p=>p.counts.total > 0);
    return PLACES.filter(p=>p.counts[FILTER] > 0);
  }

  function renderList(){
    const list = visible();
    $("#count-line").textContent = list.length
      ? `${list.length} place${list.length===1?'':'s'}`
      : "";
    $("#place-grid").innerHTML = list.length
      ? list.map(placeCard).join("")
      : `<div class="state" style="grid-column:1/-1"><b>Nothing matches that filter</b>Try another.</div>`;
  }

  function render(){
    document.title = `TripVibz · ${CITY.name}`;
    const total = PLACES.reduce((n,p)=>n+p.counts.total,0);

    $("#city").innerHTML = `
      <div class="city-head">
        <h1>${escapeHtml(CITY.name)}${CITY.state ? `, ${escapeHtml(CITY.state)}` : ""}</h1>
        ${CITY.blurb ? `<p class="blurb">${escapeHtml(CITY.blurb)}</p>` : ""}
        <span class="pill">${PLACES.length} place${PLACES.length===1?'':'s'} · ${total} take${total===1?'':'s'}</span>
      </div>
      <div class="filters" id="filters">
        <button aria-pressed="true" data-f="all">All places</button>
        <button aria-pressed="false" data-f="has_takes">Has takes</button>
        <button aria-pressed="false" data-f="what_not_to_do">${TYPE_LABEL.what_not_to_do}</button>
        <button aria-pressed="false" data-f="worst_times">${TYPE_LABEL.worst_times}</button>
      </div>
      <div class="count-line" id="count-line"></div>
      <div class="place-grid" id="place-grid"></div>

      <div class="cta">
        <div>
          <h3>Know ${escapeHtml(CITY.name)}? Two minutes.</h3>
          <p>We're collecting what locals just know — the timing, the norms, the
             things visitors get wrong. Not business reviews. One sentence helps.</p>
        </div>
        <a class="btn" href="contribute.html?city=${encodeURIComponent(CITY.slug)}">Add a local take</a>
      </div>

      <div id="citywide-wrap" hidden>
        <div class="section-label">What locals say about ${escapeHtml(CITY.name)}</div>
        <div class="citywide" id="citywide"></div>
      </div>`;

    $("#filters").addEventListener("click", e=>{
      const b = e.target.closest("button[data-f]"); if(!b) return;
      $("#filters").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");
      FILTER = b.dataset.f;
      renderList();
    });

    renderList();
    renderCitywide();
  }

  // Takes attached to the city itself rather than a specific place. These come
  // from the contribution flow, which deliberately asks about the city overall.
  function renderCitywide(){
    if(!CITYWIDE.length) return;
    $("#citywide-wrap").hidden = false;
    $("#citywide").innerHTML = CITYWIDE
      .sort((a,b)=>(b.ups-b.downs)-(a.ups-a.downs))
      .map(p=>`<div class="cw">
        <div class="t">${escapeHtml(p.body || p.title)}</div>
        <div class="m"><span class="badge b-${p.type}">${TYPE_LABEL[p.type]||p.type}</span>
          &nbsp;▲ ${p.ups} · <a href="thread.html?id=${p.id}">discuss</a></div>
      </div>`).join("");
  }

  (async function init(){
    auth.ensure();
    if(!SLUG){ notFound("No city specified."); return; }

    const { data: city, error } = await sb.from("cities")
      .select("id,name,state,slug,blurb").eq("slug", SLUG).maybeSingle();
    if(error || !city){ notFound("That city doesn't exist yet."); return; }
    CITY = city;

    // places.city stores the city's display name, not its slug — that's the
    // join the cities_with_counts view uses too.
    const { data: places } = await sb.from("places")
      .select("id,name,neighborhood,category").eq("city", city.name).order("name");
    PLACES = places || [];

    if(PLACES.length){
      const { data: posts } = await sb.from("posts")
        .select("id,type,place_id").in("place_id", PLACES.map(p=>p.id));
      const by = {};
      (posts||[]).forEach(p=>{
        const c = by[p.place_id] = by[p.place_id] || { what_not_to_do:0, worst_times:0, total:0 };
        if(p.type in c) c[p.type]++;
        c.total++;
      });
      PLACES.forEach(p=>{ p.counts = by[p.id] || { what_not_to_do:0, worst_times:0, total:0 }; });
    }

    const { data: cw } = await sb.from("posts")
      .select("id,title,body,type,ups,downs,created_at")
      .eq("city_id", city.id).is("place_id", null);
    CITYWIDE = cw || [];

    render();
  })();
})();
</script>
</body>
</html>
