<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Add a take · TripVibz</title>
<link rel="preconnect" href="https://nkxorlktzbgwqnfwmuus.supabase.co" crossorigin>
<!--fonts-->
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/v2.css">
<script src="/assets/analytics.js" defer></script>
<style>
/* "Where is this?" (the spot a take is about; it puts the take on the city's Guide map) */
.pl-search{margin-top:0}
#place-q{width:100%;min-height:44px;font-size:16px;border-radius:12px}
.pl-common{margin-bottom:8px}
.pl-common .chip{min-height:34px;font-size:13px;padding:0 12px}
.v2 h1.add-h1{font-size:clamp(22px,5.6vw,28px);margin:4px 0 2px}
.add-sub{font-size:14px;color:var(--muted);margin:0 0 4px}
.post-wrap{margin:16px 0 8px}
.post-fine{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.4}
.tenure-card .wrapchips .chip{min-height:36px;font-size:13px}
.pl-sugg{margin-top:6px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.pl-opt{display:block;width:100%;min-height:48px;padding:9px 14px;text-align:left;border:0;border-top:1px solid var(--line);background:#fff;cursor:pointer;font:inherit;color:var(--ink)}
.pl-opt:first-child{border-top:0}
.pl-opt:hover,.pl-opt:focus-visible{background:#f7f5f0}
.pl-opt b{display:block;font-size:15px}
.pl-opt small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.pl-opt.typed b{font-weight:600}
.pl-picked{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pl-name{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--ink)}
.pl-detail{font-size:12.5px;color:var(--muted)}
.pl-note{flex-basis:100%;font-size:12.5px;color:var(--muted);order:3}
#pl-change{margin-left:auto}
</style>
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="/"><img class="brand-mark" src="/assets/brand/mark.svg" width="30" height="30" alt="">TripVibz</a>
    <nav class="nav-links"><a href="/cities/">Cities</a></nav>
    <div class="nav-right"><div id="auth-slot"></div></div>
  </div>
</header>
<main class="v2" id="root"><div class="state"><b>Loading…</b></div></main>
<div class="toast" id="toast"></div>

<script src="/assets/supabase.js"></script>
<script src="/assets/tv.js"></script>
<script src="/assets/v2.js"></script>
<script>
(function(){
  "use strict";
  const { sb, $, escapeHtml: esc, auth, submitTake, moderationMessage, toast } = window.TV;
  const T2 = window.TV2;
  const SLUG = window.TV.parseRoute().city;
  const qs = new URLSearchParams(location.search);
  const DRAFT_KEY = "tv_v2_draft";

  let CITY = null, PLACES = [], MY_TENURE = null, QS = [];
  // place: the label shown on the take; placeRef: where it is ("p:<places id>" for a spot TripVibz has,
  // "c:<catalogue id>" for one from the places catalogue, copied in on post), so it lands on the Guide map.
  const S = { kind: "hidden_gem", vibes: [], text: "", place: "", placeRef: null, placeDetail: "", placeQ: "", months: [], tenure: null, err: "", busy: false };
  try { const k = qs.get("kind"); if (T2.KIND[k]) S.kind = k; const t = qs.get("text"); if (t) S.text = t.slice(0, 400); } catch (e) {}

  const signedIn = () => !!(auth.me && !auth.me.is_anonymous);
  const placeValue = () => (S.place || "").trim();
  let PSUGG = [], PSEQ = 0, PTIMER = null;

  /* ---------------- compose ---------------- */
  function compose(){
    const K = T2.KIND[S.kind];
    const needTenure = !MY_TENURE;
    const tenureLabel = S.tenure || MY_TENURE;
    const badge = tenureLabel ? T2.tenureBadge(tenureLabel) : "Local";
    const hasVibes = !!(T2.VIBE_KINDS && T2.VIBE_KINDS[S.kind]);
    // Months matter most for a "When to go" take, so that one opens them; otherwise they wait behind "Add the months".
    const monthsOpen = S.kind === "worst_times" || S.months.length > 0;
    $("#root").innerHTML = `
      <div class="row-between" style="min-height:40px;margin-top:4px"><a class="back" href="/${CITY.slug}/">← ${esc(CITY.name)}</a></div>
      <h1 class="add-h1">A friend is visiting ${esc(CITY.name)}. What do you tell them?</h1>
      <p class="add-sub">One sentence is plenty. It goes on the ${esc(CITY.name)} page for people planning a trip.</p>

      <section class="card" aria-label="Your take">
        <div class="segs" role="group" aria-label="What kind of take">${["hidden_gem", "what_not_to_do", "worst_times"].filter(k => T2.KIND[k] && !T2.KIND[k].answerOnly).map(k =>
          `<button type="button" data-kind="${k}" aria-pressed="${S.kind===k}">${esc(T2.KIND[k].label)}</button>`).join("")}</div>
        <div class="hint" style="margin-top:8px">${esc(K.sub)}</div>

        <div class="wrapchips" style="margin:10px 0 8px">${K.starters(CITY.name).map(st => `<button type="button" class="starter" data-starter="${esc(st)}">${esc(st)}</button>`).join("")}</div>
        <textarea class="ta" id="take" autocapitalize="sentences" autocorrect="on" spellcheck="true" maxlength="400" aria-label="Your take" placeholder="Tap a starter, or just say it.">${esc(S.text)}</textarea>

        ${hasVibes ? `<div class="card-k">Vibe <small>optional, up to 2</small></div>
        <div id="vibe-sect">${T2.vibePickHtml("t", S.vibes || [], "take")}</div>` : ""}

        <div id="where"><div class="card-k">Where is this? <small>optional · goes on the Guide map</small></div>
        ${placeBox()}</div>

        <details class="more" id="more"${monthsOpen ? " open" : ""}>
          <summary><span>${S.months.length ? `When: ${esc(T2.monthsLabel(S.months))}` : `Add the months <small>optional</small>`}</span></summary>
          <div class="hint" style="margin:4px 0 8px">Tap the months it's true. Leave blank if it's year-round.</div>
          <div class="months" style="margin:0 0 6px">${T2.MON.map((m,i) => `<button type="button" data-month="${i+1}" aria-pressed="${S.months.includes(i+1)}">${m}</button>`).join("")}</div>
        </details>
      </section>

      ${needTenure ? `<section class="card tenure-card" aria-label="How long you've lived here">
        <div class="card-k">How long have you lived in ${esc(CITY.name)}? <small>asked once</small></div>
        <div class="wrapchips">${Object.keys(T2.TENURE).map(t => `<button type="button" class="chip" data-tenure="${t}" aria-pressed="${S.tenure===t}">${esc(T2.TENURE[t])}</button>`).join("")}</div>
        <div class="hint" style="margin:8px 0 0">Shows on your badge when you sign in. The ✓ comes on its own once we've seen you around ${esc(CITY.name)} (<a href="/how-we-verify-locals/" target="_blank" rel="noopener">how that works</a>).</div>
      </section>` : ""}

      <div id="slot">${S.err ? `<div class="err">${esc(S.err)}</div>` : ""}</div>

      <div class="post-wrap">
        ${signedIn() ? `
          <button type="button" class="btn-primary" id="post-badge">Post it<small>With your name and ${esc(badge)} badge</small></button>` : `
          <button type="button" class="btn-primary" id="post-badge">Post with my Local badge<small>Your name · ranks higher · can become a founding local</small></button>
          <button type="button" class="btn-quiet" id="post-anon">Post anonymously instead <small>(no sign-in · shows as “Unverified”)</small></button>`}
      </div>`;
    wireCompose();
  }

  // "Where is this?": common spots as chips, then a search over spots, neighborhoods and restaurants
  // (search_take_places, migration 20261107170000). Typing a name with no match still works (no pin).
  function placeBox(){
    if (S.place) {
      const pinned = S.placeRef && S.place !== "Whole city";
      return `<div class="pl-picked"><span class="pl-name">${T2.ICON.pin}${esc(S.place)}</span>${S.placeDetail ? `<span class="pl-detail">${esc(S.placeDetail)}</span>` : ""}
        <span class="pl-note">${pinned ? "On the Guide map" : S.place === "Whole city" ? "The whole city, no pin" : "Not on the map (we couldn't find it)"}</span>
        <button type="button" class="chip" id="pl-change">Change</button></div>`;
    }
    return `<div class="wrapchips pl-common">
        ${PLACES.slice(0, 5).map(p => `<button type="button" class="chip" data-place-ref="p:${esc(p.id)}" data-place-name="${esc(p.name)}">${esc(p.name)}</button>`).join("")}
        <button type="button" class="chip" data-place-ref="" data-place-name="Whole city">Whole city</button>
      </div>
      <div class="pl-search"><input class="inp" id="place-q" type="search" maxlength="60" autocomplete="off" enterkeyhint="search"
        role="combobox" aria-autocomplete="list" aria-controls="pl-sugg" aria-expanded="${PSUGG.length ? "true" : "false"}"
        placeholder="Search a spot, park, neighborhood or restaurant" aria-label="Search for the place" value="${esc(S.placeQ)}">
        <div class="pl-sugg" id="pl-sugg" role="listbox"${S.placeQ.trim().length >= 2 ? "" : " hidden"}>${placeSuggHtml()}</div></div>`;
  }
  function placeSuggHtml(){
    const q = S.placeQ.trim();
    const cat = c => { c = String(c || "").replace(/_/g, " "); return c ? c[0].toUpperCase() + c.slice(1) : ""; };
    const kind = r => r.kind === "eat" ? "Restaurant or bar" : r.takes ? `${r.takes} take${r.takes === 1 ? "" : "s"} here` : cat(r.category);
    return PSUGG.map((r, i) => `<button type="button" role="option" class="pl-opt" data-sugg="${i}"><b>${esc(r.name)}</b><small>${esc([kind(r), r.detail].filter(Boolean).join(" · "))}</small></button>`).join("") +
      (q.length >= 2 ? `<button type="button" role="option" class="pl-opt typed" data-typed="1"><b>Use “${esc(q.slice(0, 60))}”</b><small>As typed, without a map pin</small></button>` : "");
  }
  function searchPlaces(q){
    clearTimeout(PTIMER);
    const box = $("#pl-sugg"); if (!box) return;
    if (q.trim().length < 2) { PSUGG = []; box.hidden = true; return; }
    PTIMER = setTimeout(async () => {
      const seq = ++PSEQ;
      try {
        const r = await sb.rpc("search_take_places", { p_city: CITY.id, p_q: q.trim() });
        if (seq !== PSEQ) return;   // they kept typing
        PSUGG = (r && r.data) || [];
      } catch (e) { PSUGG = []; }
      const b = $("#pl-sugg"); if (!b) return;
      b.innerHTML = placeSuggHtml(); b.hidden = false;
      const inp = $("#place-q"); if (inp) inp.setAttribute("aria-expanded", "true");
    }, 180);
  }
  function choosePlace(name, ref, detail){
    Object.assign(S, { place: name || "", placeRef: ref || null, placeDetail: detail || "", placeQ: "" });
    PSUGG = []; compose();
  }
  // "c:<id>" (a catalogue place) becomes a places row server-side; a failure just posts without the pin.
  async function placeIdFor(ref){
    if (!ref) return null;
    if (ref.startsWith("p:")) return ref.slice(2);
    try {
      await auth.session();
      const r = await sb.rpc("ensure_spot_from_place", { p_place: ref.slice(2) });
      return r && !r.error && r.data ? r.data : null;
    } catch (e) { console.error(e); return null; }
  }

  const T2_GOOGLE = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="9" fill="#fff"/><path d="M13.2 9.1c0-.3 0-.6-.1-.9H9v1.7h2.3a2 2 0 0 1-.9 1.3v1.1h1.4c.9-.8 1.4-1.9 1.4-3.2z" fill="#4285F4"/><path d="M9 13.4c1.2 0 2.1-.4 2.8-1l-1.4-1.1c-.4.3-.9.4-1.4.4-1.1 0-2.1-.8-2.4-1.8H5.1v1.1A4.3 4.3 0 0 0 9 13.4z" fill="#34A853"/><path d="M6.6 9.9a2.6 2.6 0 0 1 0-1.7V7.1H5.1a4.3 4.3 0 0 0 0 3.9l1.5-1.1z" fill="#FBBC05"/><path d="M9 6.3c.6 0 1.2.2 1.6.6l1.2-1.2A4.3 4.3 0 0 0 5.1 7.1l1.5 1.1C6.9 7.1 7.9 6.3 9 6.3z" fill="#EA4335"/></svg>';

  function wireCompose(){
    const root = $("#root");
    root.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { S.kind = b.dataset.kind; compose(); });
    root.querySelectorAll("[data-starter]").forEach(b => b.onclick = () => {
      S.text = b.dataset.starter; compose();
      const ta = $("#take"); ta.focus(); const i = ta.value.indexOf("___"); if (i >= 0) ta.setSelectionRange(i, i + 3);
    });
    const ta = $("#take");
    ta.addEventListener("input", () => { S.text = ta.value; });
    root.querySelectorAll("[data-place-ref]").forEach(b => b.onclick = () => choosePlace(b.dataset.placeName, b.dataset.placeRef, ""));
    const pc = $("#pl-change"); if (pc) pc.onclick = () => { Object.assign(S, { place: "", placeRef: null, placeDetail: "" }); compose(); const f = $("#place-q"); if (f) f.focus(); };
    const pq = $("#place-q");
    if (pq) {
      pq.addEventListener("input", () => { S.placeQ = pq.value; searchPlaces(pq.value); });
      pq.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); const f = $("#pl-sugg .pl-opt"); if (f && !$("#pl-sugg").hidden) f.click(); } });
    }
    const ps = $("#pl-sugg");
    if (ps) {
      ps.addEventListener("mousedown", e => e.preventDefault());
      ps.addEventListener("click", e => {
        const b = e.target.closest(".pl-opt"); if (!b) return;
        if (b.dataset.typed) { choosePlace(S.placeQ.trim().slice(0, 60), null, ""); return; }
        const r = PSUGG[Number(b.dataset.sugg)]; if (r) choosePlace(r.name, r.ref, r.detail || "");
      });
    }
    root.querySelectorAll("[data-month]").forEach(b => b.onclick = () => {
      const m = Number(b.dataset.month); S.months = S.months.includes(m) ? S.months.filter(x => x !== m) : S.months.concat(m); compose();
      const d = $("#more"); if (d) d.open = true;
    });
    root.querySelectorAll("[data-tenure]").forEach(b => b.onclick = () => { S.tenure = b.dataset.tenure; compose(); });
    const vs = $("#vibe-sect");
    if (vs) vs.addEventListener("click", e => {
      const more = e.target.closest("[data-more-vibes]"); if (more) { T2.expandMood(more, "take"); return; }
      const b = e.target.closest("[data-pick-vibe]"); if (!b) return;
      const next = T2.togglePick(S.vibes, b.dataset.pickVibe.split(":")[1]);
      if (!next) { toast("Two vibes at most. Tap one to swap it."); return; }
      S.vibes = next; compose();
    });
    $("#post-badge").onclick = () => submit(true);
    const an = $("#post-anon"); if (an) an.onclick = () => submit(false);
  }

  function validate(){
    const t = (S.text || "").trim();
    if (t.length < 15) return "A few more words. One full sentence is plenty.";
    if (t.includes("___")) return "Fill in the blanks first.";
    return "";
  }

  async function submit(withBadge){
    if (S.busy) return;
    S.err = validate(); if (S.err) { compose(); return; }
    if (withBadge && !signedIn()) {
      // Keep the draft, sign in, and publish it as verified after the reload.
      try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ slug: SLUG, S })); } catch (e) {}
      await T2.signInForBadge({ pending: true });
      return;
    }
    await publish();
  }

  async function publish(){
    S.busy = true;
    document.querySelectorAll(".btn-primary, .btn-quiet").forEach(b => b.disabled = true);
    const text = S.text.trim();
    const title = text.length <= 160 ? text : text.slice(0, 157).replace(/\s+\S*$/, "") + "…";
    try {
      if (S.tenure) await T2.saveTenure(CITY.id, S.tenure);
      const place_id = await placeIdFor(S.placeRef);
      const { row } = await submitTake({
        title, body: text.length > 160 ? text : null, type: S.kind,
        city_id: CITY.id, city_name: CITY.name, place_id,
        place_label: placeValue() || null, months: S.months.slice().sort((a,b) => a-b)
      });
      try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
      // Vibes only for recommendations; a failure here never blocks the posted page.
      if (T2.VIBE_KINDS[S.kind] && (S.vibes || []).length) { try { await T2.saveMyVibes("post_id", { [row.id]: S.vibes.slice(0, 2) }); } catch (e) { console.error(e); } }
      history.replaceState(null, "", `/${CITY.slug}/add/?posted=${row.id}`);
      await posted(row.id);
    } catch (err) {
      console.error(err);
      S.err = moderationMessage(err) || (/RATE_LIMITED/.test(String(err && err.message))
        ? (signedIn() ? "That's your limit for today. Come back tomorrow." : "You've posted 3 today without signing in. Sign in to post more.")
        : "That didn't post. Try again.");
      S.busy = false; compose();
    }
  }

  /* ---------------- after posting ---------------- */
  async function posted(id){
    const r = await sb.from("posts").select(T2.POST_COLS).eq("id", id).maybeSingle();
    const p = r.data;
    if (!p) { location.replace(`/${CITY.slug}/`); return; }
    const ctx = await T2.hydrate([p], CITY.id);
    const mine = auth.me && p.author_id === auth.me.id;
    const verified = p.author_verified;
    const rank = ctx.founders[p.author_id];
    const left = Math.max(0, 10 - ctx.founderCount);
    const nextQ = QS.find(x => !x.mine);
    const url = `${location.origin}/${CITY.slug}/`;
    const badge = verified ? T2.tenureBadge(ctx.tenure[p.author_id]) : (MY_TENURE || S.tenure ? T2.tenureBadge(MY_TENURE || S.tenure) : "Local");

    $("#root").innerHTML = `
      <div class="row-between" style="min-height:44px;margin-top:6px"><a class="back" href="/${CITY.slug}/">← ${esc(CITY.name)}</a></div>
      <span class="live">${T2.ICON.check.replace("<svg", '<svg width="14" height="14"')}Your take is live</span>
      <div style="margin-top:12px">${T2.takeHtml(p, ctx, { noBar: true })}</div>

      ${mine && !verified ? `
      <section class="dark" style="margin-top:18px">
        <h2>Get updates on your takes</h2>
        <div style="font-size:14px;color:#e9e3d7;margin-top:6px">Sign in and this take moves to your name.</div>
        <ul>
          <li>Your <b style="color:#fff">${esc(badge)}</b> badge instead of “Unverified” (the ✓ follows once we've seen you around town)</li>
          <li>Your takes rank higher in the feed</li>
          <li>A shot at a founding-local spot in ${esc(CITY.name)} once your ✓ comes through${left ? ` (${left} left)` : ""}</li>
                  </ul>
        <button class="bigbtn" id="claim" style="background:#fff;color:#16130e"><b>Sign in</b></button>
        <div class="fine">Takes you already posted move to your name.</div>
      </section>` : ""}

      ${verified ? `
      <section class="box" style="margin-top:18px">
        <div class="row-between" style="font-weight:800;font-size:14.5px"><span>${esc(CITY.name)} founding locals</span><span>${ctx.founderCount} of 10</span></div>
        <div class="spots" aria-hidden="true">${Array.from({length:10}, (_, i) => `<i class="${i < ctx.founderCount ? "on" : ""}"></i>`).join("")}</div>
        <div style="font-size:13px;color:#5f5a50">${rank ? `You're founding local #${rank}. ` : ""}${left ? `${left} spot${left === 1 ? "" : "s"} left. Know a local who'd argue with you?` : "All 10 spots are taken."}</div>
      </section>` : ""}

      <section class="sect">
        <h2 style="font-size:17px;margin-bottom:4px">Do your friends agree?</h2>
        <div class="sub" style="margin:0 0 12px">Send your take as a card. Their votes show up on it.</div>
        <div class="share-row">
          <canvas id="card" aria-label="Share card preview" role="img"></canvas>
          <div class="share-btns">
            <button class="primary" id="share">Share</button>
            <button id="sms">Text it to a friend</button>
            <button id="copy">Copy link</button>
          </div>
        </div>
      </section>

      ${T2.emailSignupHtml(CITY, "after_post")}

      <section class="sect">
        ${nextQ ? `<a class="next-q" href="/${CITY.slug}/vote/?q=${nextQ.id}"><span><b>${QS.filter(x => !x.mine).length} quick question${QS.filter(x => !x.mine).length === 1 ? "" : "s"} about ${esc(CITY.name)}</b><span>One tap each.</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16130e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>`
        : `<a class="next-q" href="/${CITY.slug}/"><span><b>See what others said</b><span>${esc(CITY.name)} feed</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16130e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>`}
      </section>`;

    const takeUrl = `${location.origin}${window.TV.routes.thread(p.id)}`;
    const card = { city: CITY.name, text: p.title, place: T2.placeOf(p, ctx), badge: verified ? badge : "", ups: p.ups, downs: p.downs, url: url };
    const canvas = $("#card"); await T2.drawShareCard(canvas, card);
    $("#share").onclick = async () => { const r = await T2.shareCard(canvas, Object.assign({}, card, { url: takeUrl })); if (r === "downloaded") toast("Card saved. Post it to your story."); };
    $("#sms").onclick = () => { location.href = `sms:?&body=${encodeURIComponent(`A ${CITY.name} local says: “${p.title}” True or nope? ${takeUrl}`)}`; };
    $("#copy").onclick = async () => { try { await navigator.clipboard.writeText(takeUrl); toast("Link copied"); } catch (e) { prompt("Copy this link:", takeUrl); } };
    T2.mountEmailSignup($("#root"), CITY);
    const claim = $("#claim"); if (claim) claim.onclick = () => T2.signInForBadge({ pending: false });
  }

  /* ---------------- init ---------------- */
  (async function init(){
    CITY = SLUG && await T2.loadCity(SLUG);
    if (!CITY) { $("#root").innerHTML = `<div class="state"><b>City not found</b><a href="/cities/">← All cities</a></div>`; return; }
    document.title = `Add a take about ${CITY.name} · TripVibz`;
    await auth.ensure();
    await T2.finishClaim();
    const [pl, tn, qq] = await Promise.all([
      sb.from("places").select("id,name").eq("city_id", CITY.id).order("name"),
      auth.me ? sb.from("city_tenure").select("tenure").eq("city_id", CITY.id).eq("user_id", auth.me.id).maybeSingle() : { data: null },
      T2.loadQuestions(CITY.id)
    ]);
    PLACES = (pl.data || []).slice(0, 8);
    MY_TENURE = tn.data ? tn.data.tenure : null;
    QS = qq;

    const postedId = qs.get("posted");
    if (postedId) { await posted(postedId); return; }

    // Returning from Google sign-in with a saved draft: publish it now.
    let d = null; try { d = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "null"); } catch (e) {}
    if (d && d.slug === SLUG) {
      Object.assign(S, d.S, { err: "", busy: false });
      if (signedIn()) { compose(); await publish(); return; }
    }
    compose();
  })();
})();
</script>
